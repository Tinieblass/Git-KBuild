<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Flash Kernel FK mark</title><desc id="desc">Original angular FK monogram with a gold lightning bolt and HyperOS alioth subtitle.</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6a1"/><stop offset=".42" stop-color="#ffd000"/><stop offset="1" stop-color="#e87500"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#9da6b2"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff5145"/><stop offset="1" stop-color="#8e0010"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="620" rx="38" fill="#08090d"/>
<circle cx="500" cy="240" r="184" fill="none" stroke="#6f4b00" stroke-width="7"/>
<circle cx="500" cy="240" r="166" fill="none" stroke="url(#gold)" stroke-width="5" opacity=".9"/>
<path d="M250 240 L350 115 L350 365 L250 365 Z" fill="url(#silver)" stroke="#16191f" stroke-width="8"/>
<path d="M565 115 L760 115 L690 205 L780 365 L660 365 L570 240 L570 365 L455 365 L455 115 Z" fill="url(#red)" stroke="#26040a" stroke-width="8"/>
<path d="M555 30 L430 250 L530 250 L445 450 L680 195 L565 195 L650 30 Z" fill="url(#gold)" stroke="#3b2500" stroke-width="8" filter="url(#glow)"/>
<text x="500" y="500" fill="url(#silver)" font-family="Arial,sans-serif" font-size="72" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="3">FLASH KERNEL</text>
<path d="M220 525 H780" stroke="url(#gold)" stroke-width="4"/>
<text x="500" y="575" fill="#f3cf42" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle" letter-spacing="5">HyperOS / alioth</text>
</svg>
