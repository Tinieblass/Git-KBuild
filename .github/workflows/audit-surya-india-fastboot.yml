name: Audit POCO X3 India 6000mAh firmware battery data

on:
  workflow_dispatch:
  push:
    branches:
      - Flash-Kernel
    paths:
      - '.github/workflows/audit-surya-india-fastboot.yml'
      - 'tools/audit_surya_india_fastboot.sh'
      - 'tools/extract_android_dtbo.py'
      - 'tools/extract_qualcomm_xbl_raw.py'

permissions:
  contents: read

concurrency:
  group: surya-india-firmware-audit
  cancel-in-progress: true

jobs:
  extract-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout research scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install image inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 file device-tree-compiler python3-venv python3-dev build-essential e2fsprogs erofs-utils

      - name: Set up Go for sparse super-image inspection
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download, verify, extract and inspect official India fastboot ROM
        run: |
          bash tools/audit_surya_india_fastboot.sh surya-india-firmware-audit

      - name: Upload compact India audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surya-india-6000mah-firmware-audit
          path: |
            surya-india-firmware-audit/SURYA-INDIA-FASTBOOT-AUDIT.txt
            surya-india-firmware-audit/archive-members.txt
            surya-india-firmware-audit/image-members.txt
            surya-india-firmware-audit/india-device-tree-battery-hits.txt
            surya-india-firmware-audit/india-M703-profile-details.txt
            surya-india-firmware-audit/india-M703-profile-manifest.tsv
            surya-india-firmware-audit/india-dtbo/DTBO-MANIFEST.tsv
            surya-india-firmware-audit/embedded-fdt/**/FDT-MANIFEST.tsv
            surya-india-firmware-audit/xbl-string-hits.txt
            surya-india-firmware-audit/xbl-raw/RAW-MANIFEST.tsv
            surya-india-firmware-audit/xbl-raw/FFS-INVENTORY.tsv
            surya-india-firmware-audit/xbl-raw/BATTERY-STRING-HITS.txt
            surya-india-firmware-audit/xbl-raw/SECTION-STRING-HITS.txt
            surya-india-firmware-audit/xbl-raw/BATTERY-PROVISION-SEARCH.txt
            surya-india-firmware-audit/other-raw/**/RAW-MANIFEST.tsv
            surya-india-firmware-audit/other-raw/**/BATTERY-STRING-HITS.txt
            surya-india-firmware-audit/uefi-deep/DEEP-UEFI-MANIFEST.tsv
            surya-india-firmware-audit/uefi-deep/DEEP-UEFI-SEARCH.txt
            surya-india-firmware-audit/uefi-deep/BATTERY-PROFILE-MODULES.txt
            surya-india-firmware-audit/uefi-deep/battery-profile-modules/**
            surya-india-firmware-audit/uefi-deep/uefi-firmware-parser.log
            surya-india-firmware-audit/uefi-deep/pip-download.log
            surya-india-firmware-audit/uefi-deep/pip-install.log
            surya-india-firmware-audit/super-audit/SUPER-PARTITIONS.txt
            surya-india-firmware-audit/super-audit/SUPER-EXTRACTION-LOG.txt
            surya-india-firmware-audit/super-audit/SUPER-PARTITION-MANIFEST.tsv
            surya-india-firmware-audit/super-audit/SUPER-BATTERY-PATH-HITS.txt
            surya-india-firmware-audit/super-audit/SUPER-BATTERY-CONTENT-HITS.txt
            surya-india-firmware-audit/super-audit/SUPER-ELF-MANIFEST.tsv
            surya-india-firmware-audit/super-audit/SUPER-QG-BINARY-HITS.txt
            surya-india-firmware-audit/super-audit/SUPER-FILESYSTEM-EXTRACTION.log
            surya-india-firmware-audit/super-audit/SUPER-ROOT-DIR-LISTINGS.txt
            surya-india-firmware-audit/super-audit/files/**/rdump-*.log
            surya-india-firmware-audit/super-audit/SUPER-TOOLCHAIN.txt
            surya-india-firmware-audit/super-audit/consumer-export/**
            surya-india-firmware-audit/super-audit/files/vendor/bin/bin/hvdcp_opti
            surya-india-firmware-audit/super-audit/files/vendor/etc/etc/init/**
            surya-india-firmware-audit/super-audit/files/vendor/etc/etc/permissions/**
          if-no-files-found: warn
          retention-days: 14
