name: Flash Kernel - alioth

on:
  push:
    branches:
      - Flash-Kernel
    paths:
      - '.github/workflows/flash-kernel-build.yml'
      - 'scripts/prepare_flash_kernel_backslashxx.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: flash-kernel-alioth-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libelf-dev libncurses-dev libssl-dev lz4 python3 rsync
      - name: Validate and analyze battery research inputs
        run: |
          set -euo pipefail
          python3 tools/validate_battery_research.py
          python3 tools/analyze_bn61_reference.py
      - name: Download LLVM toolchain
        timeout-minutes: 20
        run: |
          set -euo pipefail
          TOOLCHAIN_URL='https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/747f0cceb48f48bf7cf497a3e01af1389266904b/clang-r614150.tar.gz'
          for attempt in 1 2 3; do
            rm -f clang.tar.gz
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1200 \
              "$TOOLCHAIN_URL" --output clang.tar.gz
            if test -s clang.tar.gz && gzip -t clang.tar.gz; then
              break
            fi
            echo "Toolchain archive failed integrity check (attempt $attempt/3); downloading again." >&2
            rm -f clang.tar.gz
          done
          test -s clang.tar.gz
          gzip -t clang.tar.gz
          ls -lh clang.tar.gz
          mkdir clang
          tar -xzf clang.tar.gz -C clang
          test -x clang/bin/clang
          clang/bin/clang --version
          rm -f clang.tar.gz
      - name: Checkout pinned upstream kernel source
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          git clone --no-checkout https://github.com/Sayemx18/kernel_xiaomi_sm8250.git kernel
          git -C kernel checkout --detach 4d8105023e3d1474323f4118abc3b4ce6485070d
          test "$(git -C kernel rev-parse HEAD)" = '4d8105023e3d1474323f4118abc3b4ce6485070d'
          KSU_COMMIT='a9f3e2dd767ad77ac40f3874da39a7002998071f'
          git clone --filter=blob:none --no-checkout https://github.com/backslashxx/KernelSU.git kernel/KernelSU
          git -C kernel/KernelSU fetch --depth=1 origin refs/tags/v3.3.1-35
          git -C kernel/KernelSU checkout --detach "$KSU_COMMIT"
          test "$(git -C kernel/KernelSU rev-parse HEAD)" = "$KSU_COMMIT"
          test -f kernel/KernelSU/kernel/Kconfig
          test -f kernel/KernelSU/kernel/Makefile
          rm -rf kernel/KernelSU-Next
          rm -f kernel/drivers/kernelsu
          ln -s ../KernelSU/kernel kernel/drivers/kernelsu
          test -f kernel/drivers/kernelsu/Kconfig
          test -f kernel/drivers/kernelsu/Makefile
          cp kernel/arch/arm64/configs/vendor/xiaomi/raikiri.config kernel/arch/arm64/configs/vendor/xiaomi/flash-kernel.config
          git -C kernel diff --check
      - name: Integrate pinned NoMount v2.2.0 source
        run: |
          set -euo pipefail
          NOMOUNT_COMMIT='bf1847f98fed382369c43bfd652cd93774b9b8e3'
          git clone --no-checkout https://github.com/maxsteeel/nomount.git NoMount
          git -C NoMount fetch --depth=1 origin "$NOMOUNT_COMMIT"
          git -C NoMount checkout --detach "$NOMOUNT_COMMIT"
          test "$(git -C NoMount rev-parse HEAD)" = "$NOMOUNT_COMMIT"
          grep -q '^version=v2.2.0$' NoMount/module/module.prop
          test -s NoMount/kernel/src/nomount.c
          test -s NoMount/kernel/src/Kconfig
          test -s NoMount/kernel/src/Makefile
          ln -s "$GITHUB_WORKSPACE/NoMount/kernel/src" "$GITHUB_WORKSPACE/kernel/fs/nomount"
          grep -qF 'obj-$(CONFIG_NOMOUNT) += nomount/' kernel/fs/Makefile || printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> kernel/fs/Makefile
          python3 - <<'PY'
          from pathlib import Path
          p = Path("kernel/fs/Kconfig")
          s = p.read_text()
          entry = 'source "fs/nomount/Kconfig"'
          if entry not in s:
              pos = s.rfind("\nendmenu")
              if pos < 0:
                  raise SystemExit("ERROR: fs/Kconfig has no endmenu insertion point")
              s = s[:pos] + "\n" + entry + s[pos:]
              p.write_text(s)
          PY
          git -C kernel diff --check
      - name: Adapt source for backslashxx KernelSU
        run: |
          set -euo pipefail
          python3 scripts/prepare_flash_kernel_backslashxx.py kernel
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/KernelSU/kernel/Kconfig')
          s = p.read_text()
          gate = '\tdepends on DEPRECATED\n'
          if s.count(gate) != 1:
              raise SystemExit(f'ERROR: expected one deprecated KSU hook gate, found {s.count(gate)}')
          p.write_text(s.replace(gate, '', 1))
          print('PATCHED: expose the early-boot Kprobes hook on this vendor kernel; its Kconfig does not define DEPRECATED.')
          PY
          git -C kernel diff --check
      - name: Preserve original stock battery and DTBO configuration
        working-directory: kernel
        run: |
          set -euo pipefail
          git diff --exit-code -- arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi arch/arm64/boot/dts/vendor/qcom/fg-gen4-batterydata-alioth-FMT-4520mah.dtsi arch/arm64/boot/dts/vendor/qcom/fg-gen4-batterydata-alioth-GY-4520mah.dtsi
          grep -q 'fg-gen4-batterydata-alioth-FMT-4520mah.dtsi' arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi
          grep -q 'fg-gen4-batterydata-alioth-GY-4520mah.dtsi' arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi
          if grep -q 'j3s-batt-profile' arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi; then echo 'ERROR: stock DTBO unexpectedly selects J3S profile' >&2; exit 1; fi
          ! grep -q 'apollo-sun-5000mah' arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi
      - name: Configure alioth with Flash Kernel fragments
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out alioth_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/xiaomi/sm8250-common.config arch/arm64/configs/vendor/xiaomi/alioth.config arch/arm64/configs/vendor/xiaomi/flash-kernel.config
          make O=out olddefconfig
          grep -qx 'CONFIG_MACH_XIAOMI_ALIOTH=y' out/.config
          grep -qx 'CONFIG_BUILD_ARM64_DT_OVERLAY=y' out/.config
          grep -qx 'CONFIG_OVERLAY_FS=y' out/.config
          grep -qx 'CONFIG_KSU=y' out/.config
          scripts/config --file out/.config --enable KPROBES
          scripts/config --file out/.config --enable KRETPROBES
          scripts/config --file out/.config --enable KSU_KPROBES_KSUD
          scripts/config --file out/.config --disable KSU_HACK_ARM64_BRANCH_LINK
          scripts/config --file out/.config --enable KSU_LSM_SECURITY_HOOKS
          scripts/config --file out/.config --disable KSU_TAMPER_SYSCALL_TABLE
          scripts/config --file out/.config --enable NOMOUNT
          make O=out olddefconfig
          # Override the upstream config fragment's legacy local version.
          scripts/config --file out/.config --set-str LOCALVERSION "-FlashKernel"
          make O=out olddefconfig
          grep -qx 'CONFIG_NOMOUNT=y' out/.config
          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KPROBES=y' out/.config
          grep -qx 'CONFIG_KRETPROBES=y' out/.config
          grep -qx 'CONFIG_KSU_KPROBES_KSUD=y' out/.config
          grep -qx '# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set' out/.config
          grep -qx 'CONFIG_KSU_LSM_SECURITY_HOOKS=y' out/.config
          grep -qx '# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set' out/.config
          grep -qx 'CONFIG_LOCALVERSION="-FlashKernel"' out/.config
          grep -E '^(CONFIG_MACH_XIAOMI|CONFIG_MACH_XIAOMI_SM8250|CONFIG_MACH_XIAOMI_ALIOTH|CONFIG_BUILD_ARM64_DT_OVERLAY|CONFIG_OVERLAY_FS=|CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_KRETPROBES=|CONFIG_KSU_KPROBES_KSUD=|# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set|CONFIG_KSU_LSM_SECURITY_HOOKS=|CONFIG_NOMOUNT=|CONFIG_LOCALVERSION=)' out/.config | tee "$GITHUB_WORKSPACE/config-report.txt"
      - name: Build Image.gz and stock alioth DTBO
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64 SUBARCH=arm64 PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER='Tinieblass' KBUILD_BUILD_HOST='GitHub-Actions'
          make O=out CC=clang LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image.gz dtbs dtbo.img
          BOOT=out/arch/arm64/boot
          test -s "$BOOT/Image.gz"
          test -s "$BOOT/dtbo.img"
          test -s "$BOOT/dts/vendor/qcom/alioth-sm8250-overlay.dtbo"
          mkdir -p "$GITHUB_WORKSPACE/flash-kernel-output"
          cp "$GITHUB_WORKSPACE/research/battery/BN61-Reference-Analysis.md" "$GITHUB_WORKSPACE/flash-kernel-output/"
          cp "$BOOT/dtbo.img" "$GITHUB_WORKSPACE/flash-kernel-output/dtbo-stock.img"
          cp "$BOOT/dts/vendor/qcom/alioth-sm8250-overlay.dtbo" "$GITHUB_WORKSPACE/flash-kernel-output/alioth-sm8250-overlay-stock.dtbo"
      - name: Reserve BN61 5850mAh profile pending validated Gen4 model
        run: |
          set -euo pipefail
          mkdir -p flash-kernel-output
          cat > flash-kernel-output/BN61-STATUS.txt <<'EOF'
          BN61 5850mAh (-6K): RESERVED / NOT BUILT.
          The available M703/Miron data is Qualcomm QG format and cannot be copied
          into the alioth Fuel Gauge Gen4 qcom,fg-profile-data payload (416 bytes).
          No BN61 profile, DTBO, or flashable ZIP is generated until a validated
          Gen4 electrical model has been derived and independently checked.
          EOF
          echo 'SAFE: no synthetic BN61 profile or DTBO will be produced.'
      - name: Verify outputs and publish raw artifacts
        working-directory: kernel
        run: |
          set -euo pipefail
          BOOT=out/arch/arm64/boot
          test -s "$BOOT/Image.gz"
          test -s "$GITHUB_WORKSPACE/flash-kernel-output/dtbo-stock.img"
          test -s "$BOOT/dts/vendor/qcom/kona.dtb"
          test -s "$BOOT/dts/vendor/qcom/kona-v2.dtb"
          test -s "$BOOT/dts/vendor/qcom/kona-v2.1.dtb"
          cp "$BOOT/Image.gz" "$GITHUB_WORKSPACE/flash-kernel-output/Image.gz"
          cp "$GITHUB_WORKSPACE/flash-kernel-output/dtbo-stock.img" "$GITHUB_WORKSPACE/flash-kernel-output/dtbo.img"
          cp "$GITHUB_WORKSPACE/flash-kernel-output/alioth-sm8250-overlay-stock.dtbo" "$GITHUB_WORKSPACE/flash-kernel-output/alioth-sm8250-overlay.dtbo"
          cp "$BOOT/dts/vendor/qcom/kona.dtb" "$BOOT/dts/vendor/qcom/kona-v2.dtb" "$BOOT/dts/vendor/qcom/kona-v2.1.dtb" "$GITHUB_WORKSPACE/flash-kernel-output/"
          cp "$GITHUB_WORKSPACE/config-report.txt" "$GITHUB_WORKSPACE/flash-kernel-output/"
          (cd "$GITHUB_WORKSPACE/flash-kernel-output" && sha256sum Image.gz dtbo.img alioth-sm8250-overlay.dtbo kona.dtb kona-v2.dtb kona-v2.1.dtb config-report.txt BN61-STATUS.txt BN61-Reference-Analysis.md > SHA256SUMS.txt)
          {
            echo '# Flash Kernel - alioth battery profiles'
            echo
            echo '- Source commit: 4d8105023e3d1474323f4118abc3b4ce6485070d'
            echo '- Target: POCO F3 / alioth / HyperOS 3 / Android 16'
            echo '- Stock profile: FMT/GY 4520mAh, original DTBO retained'
            echo '- J3S Sun profile: 5000mAh, separate verified DTBO from the pinned historical upstream build'
            echo '- BN61 profile: RESERVED (-6K); no DTBO generated pending validated Gen4 electrical characterization'
            echo '- BN61 research: M703 QG reference quantitatively audited; not converted to Gen4'
            echo '- Driver: qpnp-fg-gen4 synchronizes the selected qcom,nom-batt-capacity-mah to SRAM before capacity-learning initialization'
            echo '- Built-in driver: backslashxx/KernelSU v3.3.1-35 (commit a9f3e2dd767ad77ac40f3874da39a7002998071f)'
            echo '- MidoriSU Hook Type: Hybrid (CONFIG_KSU_KPROBES_KSUD=y; Kprobes enabled for early-boot hooks; branch-link/syscall-table hooks disabled)'
            echo '- NoMount: v2.2.0 built-in CONFIG_NOMOUNT=y from pinned commit bf1847f98fed382369c43bfd652cd93774b9b8e3'
            echo '- VoWiFi/IMS: upstream code retained; no IMS source files changed by this workflow'
            echo '- Outputs: Image.gz, stock dtbo.img and overlay DTBO, Kona base DTBs, BN61 hold status'
            echo '- This is a raw build artifact, not a flashable ZIP; no device-side testing performed.'
          } > "$GITHUB_WORKSPACE/flash-kernel-output/BUILD-REPORT.md"
      - name: Upload raw stock-battery kernel and device-tree artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flash-kernel-alioth-raw
          path: flash-kernel-output/
          if-no-files-found: error
          compression-level: 0

