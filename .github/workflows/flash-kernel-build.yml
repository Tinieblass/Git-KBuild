name: Flash Kernel v1.7 - alioth

on:
  push:
    branches:
      - Flash-Kernel
    paths:
      - '.github/workflows/flash-kernel-build.yml'
      - 'scripts/prepare_flash_kernel_backslashxx.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: flash-kernel-alioth-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libelf-dev libncurses-dev libssl-dev lz4 python3 rsync
      - name: Validate and analyze battery research inputs
        run: |
          set -euo pipefail
          python3 tools/validate_battery_research.py
          python3 tools/analyze_bn61_reference.py
          python3 tools/verify_pm855gui_checksum.py research/battery/alioth-J3S-Sun-5000mah.dtsi
      - name: Restore LLVM toolchain cache
        id: llvm_cache
        uses: actions/cache/restore@v4
        with:
          path: clang/
          key: llvm-clang-r614150-${{ runner.os }}

      - name: Download LLVM toolchain
        id: llvm_download
        if: steps.llvm_cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          TOOLCHAIN_URL='https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/747f0cceb48f48bf7cf497a3e01af1389266904b/clang-r614150.tar.gz'
          for attempt in 1 2 3; do
            rm -f clang.tar.gz
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1200 \
              "$TOOLCHAIN_URL" --output clang.tar.gz
            if test -s clang.tar.gz && gzip -t clang.tar.gz; then
              break
            fi
            echo "Toolchain archive failed integrity check (attempt $attempt/3); downloading again." >&2
            rm -f clang.tar.gz
          done
          test -s clang.tar.gz
          gzip -t clang.tar.gz
          ls -lh clang.tar.gz
          mkdir clang
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

      - name: Save LLVM toolchain cache
        if: steps.llvm_cache.outputs.cache-hit != 'true' && steps.llvm_download.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: clang/
          key: llvm-clang-r614150-${{ runner.os }}

      - name: Verify LLVM toolchain
        run: |
          set -euo pipefail
          test -x clang/bin/clang
          clang/bin/clang --version
      - name: Checkout pinned upstream kernel source
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          KERNEL_COMMIT='4d8105023e3d1474323f4118abc3b4ce6485070d'
          git clone --no-checkout --depth=1 --single-branch --branch base --no-tags https://github.com/Sayemx18/kernel_xiaomi_sm8250.git kernel
          test "$(git -C kernel rev-parse origin/base)" = "$KERNEL_COMMIT"
          git -C kernel checkout --detach "$KERNEL_COMMIT"
          test "$(git -C kernel rev-parse HEAD)" = "$KERNEL_COMMIT"
          KSU_COMMIT='a9f3e2dd767ad77ac40f3874da39a7002998071f'
          git clone --filter=blob:none --no-checkout https://github.com/backslashxx/KernelSU.git kernel/KernelSU
          # The selected backslashxx fork revision is pinned by its immutable commit SHA.
          git -C kernel/KernelSU fetch --depth=1 origin "$KSU_COMMIT"
          git -C kernel/KernelSU checkout --detach "$KSU_COMMIT"
          test "$(git -C kernel/KernelSU rev-parse HEAD)" = "$KSU_COMMIT"
          git -C kernel/KernelSU show -s --format='%H %s' "$KSU_COMMIT" | grep -Eq '^a9f3e2dd767ad77ac40f3874da39a7002998071f KernelSU v3\.3\.1\+'
          test -f kernel/KernelSU/kernel/Kconfig
          test -f kernel/KernelSU/kernel/Makefile
          rm -rf kernel/KernelSU-Next
          rm -f kernel/drivers/kernelsu
          ln -s ../KernelSU/kernel kernel/drivers/kernelsu
          test -f kernel/drivers/kernelsu/Kconfig
          test -f kernel/drivers/kernelsu/Makefile
          # The source filename belongs to the pinned upstream tree; the local config and product identity are Flash Kernel.
          cp kernel/arch/arm64/configs/vendor/xiaomi/raikiri.config kernel/arch/arm64/configs/vendor/xiaomi/flash-kernel.config
          python3 - <<'PY'
          from pathlib import Path
          p = Path("kernel/arch/arm64/configs/vendor/xiaomi/flash-kernel.config")
          s = p.read_text()
          if s.count('CONFIG_LOCALVERSION="-Raikiri-v1.7"') != 1:
              raise SystemExit("ERROR: expected one inherited local-version string")
          s = s.replace('CONFIG_LOCALVERSION="-Raikiri-v1.7"', 'CONFIG_LOCALVERSION="-Flash-Kernel-v1.7"', 1)
          if s.count("CONFIG_LOCALVERSION_AUTO=y") != 1:
              raise SystemExit("ERROR: expected one CONFIG_LOCALVERSION_AUTO=y")
          s = s.replace("CONFIG_LOCALVERSION_AUTO=y", "# CONFIG_LOCALVERSION_AUTO is not set", 1)
          p.write_text(s)
          print("PATCHED: kernel release branding is Flash-Kernel-v1.7; automatic upstream suffix disabled.")
          PY
          grep -qx 'CONFIG_LOCALVERSION="-Flash-Kernel-v1.7"' kernel/arch/arm64/configs/vendor/xiaomi/flash-kernel.config
          grep -qx '# CONFIG_LOCALVERSION_AUTO is not set' kernel/arch/arm64/configs/vendor/xiaomi/flash-kernel.config
          git -C kernel diff --check
      - name: Integrate pinned NoMount v2.2.0 source
        run: |
          set -euo pipefail
          NOMOUNT_COMMIT='bf1847f98fed382369c43bfd652cd93774b9b8e3'
          git clone --no-checkout https://github.com/maxsteeel/nomount.git NoMount
          git -C NoMount fetch --depth=1 origin "$NOMOUNT_COMMIT"
          git -C NoMount checkout --detach "$NOMOUNT_COMMIT"
          test "$(git -C NoMount rev-parse HEAD)" = "$NOMOUNT_COMMIT"
          grep -q '^version=v2.2.0$' NoMount/module/module.prop
          test -s NoMount/kernel/src/nomount.c
          test -s NoMount/kernel/src/Kconfig
          test -s NoMount/kernel/src/Makefile
          ln -s "$GITHUB_WORKSPACE/NoMount/kernel/src" "$GITHUB_WORKSPACE/kernel/fs/nomount"
          grep -qF 'obj-$(CONFIG_NOMOUNT) += nomount/' kernel/fs/Makefile || printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> kernel/fs/Makefile
          python3 - <<'PY'
          from pathlib import Path
          p = Path("kernel/fs/Kconfig")
          s = p.read_text()
          entry = 'source "fs/nomount/Kconfig"'
          if entry not in s:
              pos = s.rfind("\nendmenu")
              if pos < 0:
                  raise SystemExit("ERROR: fs/Kconfig has no endmenu insertion point")
              s = s[:pos] + "\n" + entry + s[pos:]
              p.write_text(s)
          PY
          git -C kernel diff --check
      - name: Adapt source for backslashxx KernelSU
        run: |
          set -euo pipefail
          python3 scripts/prepare_flash_kernel_backslashxx.py kernel
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/KernelSU/kernel/Kconfig')
          s = p.read_text()
          gate = '\tdepends on DEPRECATED\n'
          if s.count(gate) != 1:
              raise SystemExit(f'ERROR: expected one deprecated KSU hook gate, found {s.count(gate)}')
          p.write_text(s.replace(gate, '', 1))
          print('PATCHED: expose the early-boot Kprobes hook on this vendor kernel; its Kconfig does not define DEPRECATED.')
          PY
          git -C kernel diff --check
      - name: Preserve original stock battery and DTBO configuration
        working-directory: kernel
        run: |
          set -euo pipefail
          git diff --exit-code -- arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi arch/arm64/boot/dts/vendor/qcom/fg-gen4-batterydata-alioth-FMT-4520mah.dtsi arch/arm64/boot/dts/vendor/qcom/fg-gen4-batterydata-alioth-GY-4520mah.dtsi
          grep -q 'fg-gen4-batterydata-alioth-FMT-4520mah.dtsi' arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi
          grep -q 'fg-gen4-batterydata-alioth-GY-4520mah.dtsi' arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi
          if grep -q 'j3s-batt-profile' arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi; then echo 'ERROR: stock DTBO unexpectedly selects J3S profile' >&2; exit 1; fi
          if grep -q 'apollo-sun-5000mah' arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi; then
            echo 'ERROR: stale Apollo Sun profile reference found in stock DTBO source' >&2
            exit 1
          fi
      - name: Configure alioth with Flash Kernel fragments
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out alioth_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/xiaomi/sm8250-common.config arch/arm64/configs/vendor/xiaomi/alioth.config arch/arm64/configs/vendor/xiaomi/flash-kernel.config
          make O=out olddefconfig
          grep -qx 'CONFIG_MACH_XIAOMI_ALIOTH=y' out/.config
          grep -qx 'CONFIG_BUILD_ARM64_DT_OVERLAY=y' out/.config
          grep -qx 'CONFIG_LOCALVERSION="-Flash-Kernel-v1.7"' out/.config
          grep -qx '# CONFIG_LOCALVERSION_AUTO is not set' out/.config
          if grep -qi 'raikiri' out/.config; then
            echo 'ERROR: inherited project branding remains in the final kernel config' >&2
            exit 1
          fi
          grep -qx 'CONFIG_OVERLAY_FS=y' out/.config
          grep -qx 'CONFIG_KSU=y' out/.config
          scripts/config --file out/.config --enable KPROBES
          scripts/config --file out/.config --enable KRETPROBES
          scripts/config --file out/.config --enable KSU_KPROBES_KSUD
          scripts/config --file out/.config --disable KSU_HACK_ARM64_BRANCH_LINK
          scripts/config --file out/.config --enable KSU_LSM_SECURITY_HOOKS
          scripts/config --file out/.config --disable KSU_TAMPER_SYSCALL_TABLE
          scripts/config --file out/.config --enable NOMOUNT
          make O=out olddefconfig
          # Override the upstream config fragment's legacy local version.
          scripts/config --file out/.config --set-str LOCALVERSION "-Flash-Kernel-v1.7"
          make O=out olddefconfig
          grep -qx 'CONFIG_NOMOUNT=y' out/.config
          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KPROBES=y' out/.config
          grep -qx 'CONFIG_KRETPROBES=y' out/.config
          grep -qx 'CONFIG_KSU_KPROBES_KSUD=y' out/.config
          grep -qx '# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set' out/.config
          grep -qx 'CONFIG_KSU_LSM_SECURITY_HOOKS=y' out/.config
          grep -qx '# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set' out/.config
          grep -qx 'CONFIG_LOCALVERSION="-Flash-Kernel-v1.7"' out/.config
          grep -E '^(CONFIG_MACH_XIAOMI|CONFIG_MACH_XIAOMI_SM8250|CONFIG_MACH_XIAOMI_ALIOTH|CONFIG_BUILD_ARM64_DT_OVERLAY|CONFIG_OVERLAY_FS=|CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_KRETPROBES=|CONFIG_KSU_KPROBES_KSUD=|# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set|CONFIG_KSU_LSM_SECURITY_HOOKS=|CONFIG_NOMOUNT=|CONFIG_LOCALVERSION=)' out/.config | tee "$GITHUB_WORKSPACE/config-report.txt"
      - name: Build Image.gz and verify stock alioth DTBO contents
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64 SUBARCH=arm64 PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER='Tinieblass' KBUILD_BUILD_HOST='GitHub-Actions'
          BOOT=out/arch/arm64/boot
          OUT="$GITHUB_WORKSPACE/flash-kernel-output"
          DTC="$GITHUB_WORKSPACE/kernel/scripts/dtc/dtc"
          mkdir -p "$OUT"
          # DTBO_OBJS is expanded with $(shell find ...) when make parses the
          # Makefile. Build overlays first, then invoke dtbo.img in a new make
          # process so the combined image cannot silently omit alioth's overlay.
          make O=out CC=clang LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image.gz dtbs
          test -s "$BOOT/Image.gz"
          test -s "$BOOT/dts/vendor/qcom/alioth-sm8250-overlay.dtbo"
          make O=out CC=clang LLVM=1 LLVM_IAS=1 -j"$(nproc)" dtbo.img
          test -s "$BOOT/dtbo.img"
          test -x "$DTC"
          "$DTC" -q -I dtb -O dts -o "$OUT/stock-overlay-check.dts" "$BOOT/dts/vendor/qcom/alioth-sm8250-overlay.dtbo"
          grep -q 'K11A_FMT_4520mah' "$OUT/stock-overlay-check.dts"
          grep -q 'K11A_GY_4520mah' "$OUT/stock-overlay-check.dts"
          grep -q 'qcom,fg-profile-data' "$OUT/stock-overlay-check.dts"
          python3 "$GITHUB_WORKSPACE/tools/extract_android_dtbo.py" --image "$BOOT/dtbo.img" --out "$OUT/stock-dtbo-entries"
          STOCK_ENTRY_COUNT=0
          ENTRY_DTS="$OUT/stock-entry-check.dts"
          for entry in "$OUT"/stock-dtbo-entries/dtbo-*.dtb; do
            if "$DTC" -q -I dtb -O dts -o "$ENTRY_DTS" "$entry" 2>/dev/null; then
              if grep -q 'K11A_FMT_4520mah' "$ENTRY_DTS" && grep -q 'K11A_GY_4520mah' "$ENTRY_DTS"; then
                STOCK_ENTRY_COUNT=$((STOCK_ENTRY_COUNT + 1))
              fi
            fi
          done
          rm -f "$ENTRY_DTS"
          if [[ "$STOCK_ENTRY_COUNT" -eq 0 ]]; then
            echo "ERROR: combined stock DTBO contains no alioth FMT/GY battery profile entry." >&2
            echo "Extracted DTBO manifest:" >&2
            cat "$OUT/stock-dtbo-entries/DTBO-MANIFEST.tsv" >&2
            exit 1
          fi
          {
            echo 'Flash Kernel stock alioth battery profile verification'
            echo "Overlay SHA-256: $(sha256sum "$BOOT/dts/vendor/qcom/alioth-sm8250-overlay.dtbo" | awk '{print $1}')"
            echo "Combined DTBO SHA-256: $(sha256sum "$BOOT/dtbo.img" | awk '{print $1}')"
            echo "Stock FMT/GY profile entries in combined DTBO: $STOCK_ENTRY_COUNT"
            grep -E 'qcom,(battery-type|nom-batt-capacity-mah|batt-id-kohm|battery-beta|checksum)' "$OUT/stock-overlay-check.dts"
          } > "$OUT/STOCK-DTBO-VERIFICATION.txt"
          rm -rf "$OUT/stock-dtbo-entries" "$OUT/stock-overlay-check.dts"
          cp "$GITHUB_WORKSPACE/research/battery/BN61-Reference-Analysis.md" "$OUT/"
          cp "$BOOT/dtbo.img" "$OUT/dtbo-stock.img"
          cp "$BOOT/dts/vendor/qcom/alioth-sm8250-overlay.dtbo" "$OUT/alioth-sm8250-overlay-stock.dtbo"
      - name: Build J3S Sun 5000mAh DTBO in this Flash Kernel run
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64 SUBARCH=arm64 PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER='Tinieblass' KBUILD_BUILD_HOST='GitHub-Actions'
          DTSI=arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi
          J3S_SOURCE="$GITHUB_WORKSPACE/research/battery/alioth-J3S-Sun-5000mah.dtsi"
          J3S_TARGET=arch/arm64/boot/dts/vendor/qcom/fg-gen4-batterydata-alioth-J3S-Sun-5000mah.dtsi
          OUT="$GITHUB_WORKSPACE/flash-kernel-output"
          DTC="$GITHUB_WORKSPACE/kernel/scripts/dtc/dtc"
          test -s "$J3S_SOURCE"
          python3 "$GITHUB_WORKSPACE/tools/verify_pm855gui_checksum.py" "$J3S_SOURCE"
          grep -q 'qcom,battery-type = "j3ssun_5000mah"' "$J3S_SOURCE"
          grep -q 'qcom,nom-batt-capacity-mah = <5000>' "$J3S_SOURCE"
          grep -q 'qcom,batt-id-kohm = <100>' "$J3S_SOURCE"
          grep -q 'qcom,battery-beta = <4250>' "$J3S_SOURCE"
          cp "$J3S_SOURCE" "$J3S_TARGET"
          python3 - "$DTSI" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          old = '\t\t#include "fg-gen4-batterydata-alioth-FMT-4520mah.dtsi"\n\t\t#include "fg-gen4-batterydata-alioth-GY-4520mah.dtsi"'
          new = '\t\t#include "fg-gen4-batterydata-alioth-J3S-Sun-5000mah.dtsi"'
          if text.count(old) != 1:
              raise SystemExit(f"ERROR: expected exactly one stock FMT/GY include pair, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          print("PATCHED: temporary J3S Sun 5000mAh battery-data include for the separate DTBO build.")
          PY
          git diff --check
          grep -q 'fg-gen4-batterydata-alioth-J3S-Sun-5000mah.dtsi' "$DTSI"
          if grep -q 'fg-gen4-batterydata-alioth-FMT-4520mah.dtsi' "$DTSI"; then
            echo 'ERROR: J3S DTBO source unexpectedly includes the stock FMT profile' >&2
            exit 1
          fi
          if grep -q 'fg-gen4-batterydata-alioth-GY-4520mah.dtsi' "$DTSI"; then
            echo 'ERROR: J3S DTBO source unexpectedly includes the stock GY profile' >&2
            exit 1
          fi
          BOOT=out/arch/arm64/boot
          rm -f "$BOOT/dtbo.img" "$BOOT/dts/vendor/qcom/alioth-sm8250-overlay.dtbo"
          # Build DTBs/overlays first. This kernel's arm64/boot/Makefile expands
          # DTBO_OBJS with an immediate $(shell find ...) at make parse time.
          # A single "make dtbs dtbo.img" can therefore omit an overlay created
          # later in that same invocation from the combined image.
          make O=out CC=clang LLVM=1 LLVM_IAS=1 -j"$(nproc)" dtbs
          test -s "$BOOT/dts/vendor/qcom/alioth-sm8250-overlay.dtbo"
          make O=out CC=clang LLVM=1 LLVM_IAS=1 -j"$(nproc)" dtbo.img
          test -s "$BOOT/dtbo.img"
          cp "$BOOT/dtbo.img" "$OUT/dtbo-j3s.img"
          cp "$BOOT/dts/vendor/qcom/alioth-sm8250-overlay.dtbo" "$OUT/alioth-sm8250-overlay-j3s.dtbo"
          test -x "$DTC"
          "$DTC" -q -I dtb -O dts -o "$OUT/j3s-overlay-check.dts" "$OUT/alioth-sm8250-overlay-j3s.dtbo"
          grep -q 'j3ssun_5000mah' "$OUT/j3s-overlay-check.dts"
          grep -q 'qcom,nom-batt-capacity-mah' "$OUT/j3s-overlay-check.dts"
          grep -q 'qcom,fg-profile-data' "$OUT/j3s-overlay-check.dts"
          python3 "$GITHUB_WORKSPACE/tools/extract_android_dtbo.py" --image "$OUT/dtbo-j3s.img" --out "$OUT/j3s-dtbo-entries"
          J3S_ENTRY_COUNT=0
          ENTRY_DTS="$OUT/j3s-entry-check.dts"
          for entry in "$OUT"/j3s-dtbo-entries/dtbo-*.dtb; do
            # Do not pipe dtc into grep -q under pipefail: grep may close early and
            # make dtc exit with SIGPIPE, falsely reporting zero matching entries.
            if "$DTC" -q -I dtb -O dts -o "$ENTRY_DTS" "$entry" 2>/dev/null; then
              if grep -q 'j3ssun_5000mah' "$ENTRY_DTS"; then
                J3S_ENTRY_COUNT=$((J3S_ENTRY_COUNT + 1))
              fi
            fi
          done
          rm -f "$ENTRY_DTS"
          if [[ "$J3S_ENTRY_COUNT" -eq 0 ]]; then
            echo "ERROR: combined DTBO image contains no J3S Sun profile entry." >&2
            echo "Extracted DTBO manifest:" >&2
            cat "$OUT/j3s-dtbo-entries/DTBO-MANIFEST.tsv" >&2
            exit 1
          fi
          {
            echo 'Flash Kernel J3S Sun 5000mAh profile verification'
            echo "Source SHA-256: $(sha256sum "$J3S_SOURCE" | awk '{print $1}')"
            echo "Overlay SHA-256: $(sha256sum "$OUT/alioth-sm8250-overlay-j3s.dtbo" | awk '{print $1}')"
            echo "Combined DTBO SHA-256: $(sha256sum "$OUT/dtbo-j3s.img" | awk '{print $1}')"
            echo "Profile nodes in combined DTBO: $J3S_ENTRY_COUNT"
            grep -E 'qcom,(battery-type|nom-batt-capacity-mah|batt-id-kohm|battery-beta|therm-room-temp|therm-pull-up|max-voltage-uv|fastchg-current-ma|checksum)' "$J3S_SOURCE"
          } > "$OUT/J3S-DTBO-VERIFICATION.txt"
          rm -rf "$OUT/j3s-dtbo-entries" "$OUT/j3s-overlay-check.dts"
          git checkout -- "$DTSI"
          rm -f "$J3S_TARGET"
          git diff --check
          git diff --exit-code -- "$DTSI"
      - name: Reserve BN61 5850mAh profile pending validated Gen4 model
        run: |
          set -euo pipefail
          mkdir -p flash-kernel-output
          cat > flash-kernel-output/BN61-STATUS.txt <<'EOF'
          BN61 5850mAh (-6K): RESERVED / NOT BUILT.
          The available M703/Miron data is Qualcomm QG format and cannot be copied
          into the alioth Fuel Gauge Gen4 qcom,fg-profile-data payload (416 bytes).
          No BN61 profile, DTBO, or flashable ZIP is generated until a validated
          Gen4 electrical model has been derived and independently checked.
          EOF
          echo 'SAFE: no synthetic BN61 profile or DTBO will be produced.'
      - name: Verify outputs and publish raw artifacts
        working-directory: kernel
        run: |
          set -euo pipefail
          BOOT=out/arch/arm64/boot
          test -s "$BOOT/Image.gz"
          test -s "$GITHUB_WORKSPACE/flash-kernel-output/dtbo-stock.img"
          test -s "$GITHUB_WORKSPACE/flash-kernel-output/dtbo-j3s.img"
          test -s "$GITHUB_WORKSPACE/flash-kernel-output/alioth-sm8250-overlay-j3s.dtbo"
          test -s "$GITHUB_WORKSPACE/flash-kernel-output/J3S-DTBO-VERIFICATION.txt"
          test -s "$BOOT/dts/vendor/qcom/kona.dtb"
          test -s "$BOOT/dts/vendor/qcom/kona-v2.dtb"
          test -s "$BOOT/dts/vendor/qcom/kona-v2.1.dtb"
          KERNEL_RELEASE="$(make O=out ARCH=arm64 -s kernelrelease)"
          case "$KERNEL_RELEASE" in
            *Flash-Kernel-v1.7*) ;;
            *) echo "ERROR: unexpected kernel release string: $KERNEL_RELEASE" >&2; exit 1 ;;
          esac
          case "$KERNEL_RELEASE" in
            *[Rr]aikiri*) echo "ERROR: inherited product name found in kernel release: $KERNEL_RELEASE" >&2; exit 1 ;;
          esac
          cp "$BOOT/Image.gz" "$GITHUB_WORKSPACE/flash-kernel-output/Image.gz"
          cp "$GITHUB_WORKSPACE/flash-kernel-output/dtbo-stock.img" "$GITHUB_WORKSPACE/flash-kernel-output/dtbo.img"
          cp "$GITHUB_WORKSPACE/flash-kernel-output/alioth-sm8250-overlay-stock.dtbo" "$GITHUB_WORKSPACE/flash-kernel-output/alioth-sm8250-overlay.dtbo"
          cp "$BOOT/dts/vendor/qcom/kona.dtb" "$BOOT/dts/vendor/qcom/kona-v2.dtb" "$BOOT/dts/vendor/qcom/kona-v2.1.dtb" "$GITHUB_WORKSPACE/flash-kernel-output/"
          cp "$GITHUB_WORKSPACE/config-report.txt" "$GITHUB_WORKSPACE/flash-kernel-output/"
          cp "$GITHUB_WORKSPACE/research/battery/BN61-Gen4-Assessment.md" "$GITHUB_WORKSPACE/flash-kernel-output/BN61-Gen4-Assessment.md"
          (cd "$GITHUB_WORKSPACE/flash-kernel-output" && sha256sum Image.gz dtbo.img dtbo-j3s.img alioth-sm8250-overlay.dtbo alioth-sm8250-overlay-j3s.dtbo kona.dtb kona-v2.dtb kona-v2.1.dtb config-report.txt BN61-STATUS.txt BN61-Reference-Analysis.md BN61-Gen4-Assessment.md J3S-DTBO-VERIFICATION.txt > SHA256SUMS.txt)
          {
            echo '# Flash Kernel v1.7 - alioth battery profiles'
            echo
            echo '- Source commit: 4d8105023e3d1474323f4118abc3b4ce6485070d'
            echo "- Kernel release: $KERNEL_RELEASE"
            echo '- Target: POCO F3 / alioth / HyperOS 3 / Android 16'
            echo '- Stock profile: FMT/GY 4520mAh, original DTBO retained'
            echo '- J3S Sun profile: 5000mAh, DTBO compiled from Flash Kernel repository source in this same run; separate DTBO, same Image.gz/KSU/NoMount'
            echo '- BN61 profile: RESERVED (-6K); no DTBO generated pending validated Gen4 electrical characterization'
            echo '- BN61 research: M703 QG reference quantitatively audited; not converted to Gen4'
            echo '- Driver: qpnp-fg-gen4 synchronizes the selected qcom,nom-batt-capacity-mah to SRAM before capacity-learning initialization'
            echo '- Built-in driver: backslashxx/KernelSU v3.3.1-35 (commit a9f3e2dd767ad77ac40f3874da39a7002998071f)'
            echo '- MidoriSU Hook Type: Hybrid (CONFIG_KSU_KPROBES_KSUD=y; Kprobes enabled for early-boot hooks; branch-link/syscall-table hooks disabled)'
            echo '- NoMount: v2.2.0 built-in CONFIG_NOMOUNT=y from pinned commit bf1847f98fed382369c43bfd652cd93774b9b8e3'
            echo '- Outputs: Image.gz, stock and J3S DTBO images/overlays, Kona base DTBs, J3S verification and BN61 hold status'
            echo '- This is a raw build artifact, not a flashable ZIP; no device-side testing performed.'
          } > "$GITHUB_WORKSPACE/flash-kernel-output/BUILD-REPORT.md"
      - name: Upload Flash Kernel stock and J3S raw artifacts
        uses: actions/upload-artifact@v4
