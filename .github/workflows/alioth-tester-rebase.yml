name: FD-tester-alioth-builder

on:
  pull_request:
  push:
    branches:
      - Tiw-MidoriSU-alioth-test
    paths:
      - .github/trigger-full-build
  workflow_dispatch:
    inputs:
      KERNEL_TREE_1:
        description: 'Kernel Tree'
        default: 'https://github.com/re-noroi/kernel_sm8250'
        required: true
      # FD Tester Alioth Builder: use the FakeDreamer FLOS source by default.
      KERNEL_TREE_BRANCH_1:
        description: 'Kernel Tree Branch 1'
        default: 'bpf-testing'
        required: true
      CODENAME:
        description: 'Codename (do not change)'
        default: 'alioth'
        required: true
      ANYKERNEL_URL:
        description: 'AnyKernel Url (leave blank if you dont want AnyKernel)'
        default: 'https://github.com/re-noroi/anykernel3-test'
        required: false
      CUSTOM_SED:
        description: 'Custom Kernel Version'
        default: '-FakeDreamer'
        required: false
      COMPILER:
        description: 'Choose compiler'
        required: true
        type: choice
        options:
          - neutron
          - r547379
          - r574158
          - r614150
        default: neutron
      VARIANT:
        description: 'FakeDreamer ROM variant: stock, W-variant (Android 16+), or oplus-variant'
        required: true
        type: choice
        options:
          - stock
          - W-variant
          - oplus-variant
        default: W-variant
      LTO_CHOICE:
        required: true
        type: choice
        options:
          - full_lto
          - thin_lto
        default: full_lto
      REMOVE_CYCLE_COUNT:
        description: 'Remove cycle count'
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
      ENABLE_NTSYNC:
        description: '[Extra] Enable NT synchronization (NTSYNC)'
        required: false
        type: boolean
        default: true
      ENABLE_NOMOUNT:
        description: '[Extra] Enable NoMount 2.1 support (NOMOUNT)'
        required: false
        type: boolean
        default: true
      ENABLE_RAIKIRI_VOWIFI:
        description: 'Apply the IPA wake-source correction used by the VoWiFi-related fix; IMS still depends on vendor/modem support'
        required: false
        type: boolean
        default: true
      ENABLE_RW_SWAPPINESS:
        description: '[Extra] Allow modification of swappiness'
        required: false
        type: boolean
        default: false
      ENABLE_BYPASS_CHARGING:
        description: '[Extra] Enable bypass charging'
        required: false
        type: boolean
        default: false

jobs:
  prepare_clang:
    runs-on: ubuntu-latest
    env:
      COMPILER: ${{ github.event.inputs.COMPILER || 'neutron' }}
    steps:
      - name: Restore Clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: clang
          key: alioth-clang-${{ env.COMPILER }}-v1

      - name: Download & Extract Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          download_with_retry() {
            local url="$1"
            local output="$2"
            echo "Downloading: $url"
            curl --fail --location --show-error \
              --connect-timeout 30 --max-time 900 \
              --retry 6 --retry-all-errors --retry-delay 5 --retry-max-time 420 \
              --output "$output" "$url"
            test -s "$output"
          }

          if [[ "${{ env.COMPILER }}" == "r547379" ]]; then
            download_with_retry "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" clang.tar.gz
            tar -tzf clang.tar.gz >/dev/null
            mkdir clang
            tar -xzf clang.tar.gz -C clang
          elif [[ "${{ env.COMPILER }}" == "r574158" ]]; then
            download_with_retry "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/ebcc6c3bef363bc539ea39f45b6abae1dce6ff1a/clang-r574158.tar.gz" clang.tar.gz
            tar -tzf clang.tar.gz >/dev/null
            mkdir clang
            tar -xzf clang.tar.gz -C clang
          elif [[ "${{ env.COMPILER }}" == "r614150" ]]; then
            download_with_retry "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/747f0cceb48f48bf7cf497a3e01af1389266904b/clang-r614150.tar.gz" clang.tar.gz
            tar -tzf clang.tar.gz >/dev/null
            mkdir clang
            tar -xzf clang.tar.gz -C clang
          else
            download_with_retry "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst" clang.tar.zst
            if ! command -v unzstd >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y zstd
            fi
            unzstd -f clang.tar.zst
            tar -tf clang.tar >/dev/null
            mkdir clang
            tar -xf clang.tar -C clang
          fi


      - name: Verify Clang toolchain
        run: |
          set -euo pipefail
          test -x clang/bin/clang
          clang/bin/clang --version

      - name: Upload Clang toolchain for matrix jobs
        uses: actions/upload-artifact@v4
        with:
          name: clang-${{ env.COMPILER }}
          path: clang/
          if-no-files-found: error

  build:
    needs: prepare_clang
    strategy:
      matrix:
        kernel: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    env:
      UPLOAD_TO_RELEASE: false
      KERNEL_TREE_1: ${{ github.event.inputs.KERNEL_TREE_1 || 'https://github.com/re-noroi/kernel_sm8250' }}
      # Keep workflow_dispatch and push builds on the same FLOS source branch.
      KERNEL_TREE_BRANCH_1: ${{ github.event.inputs.KERNEL_TREE_BRANCH_1 || 'bpf-testing' }}
      CODENAME: ${{ github.event.inputs.CODENAME || 'alioth' }}
      ANYKERNEL_URL: ${{ github.event.inputs.ANYKERNEL_URL || 'https://github.com/re-noroi/anykernel3-test' }}
      CUSTOM_SED: ${{ github.event.inputs.CUSTOM_SED || '-FakeDreamer' }}
      COMPILER: ${{ github.event.inputs.COMPILER || 'neutron' }}
      VARIANT: ${{ github.event.inputs.VARIANT || 'W-variant' }}
      LTO_CHOICE: ${{ github.event.inputs.LTO_CHOICE || 'full_lto' }}
      REMOVE_CYCLE_COUNT: ${{ github.event.inputs.REMOVE_CYCLE_COUNT || 'no' }}
      ENABLE_NTSYNC: ${{ github.event.inputs.ENABLE_NTSYNC || 'true' }}
      ENABLE_NOMOUNT: ${{ github.event.inputs.ENABLE_NOMOUNT || 'true' }}
      ENABLE_RAIKIRI_VOWIFI: ${{ github.event.inputs.ENABLE_RAIKIRI_VOWIFI || 'true' }}
      ENABLE_RW_SWAPPINESS: ${{ github.event.inputs.ENABLE_RW_SWAPPINESS || 'false' }}
      ENABLE_BYPASS_CHARGING: ${{ github.event.inputs.ENABLE_BYPASS_CHARGING || 'false' }}

    steps:
      - name: Install Dependencies
        run: sudo apt install flex libncurses6

      - name: Download shared Clang toolchain
        uses: actions/download-artifact@v4
        with:
          name: clang-${{ env.COMPILER }}
          path: clang

      # Artifact transfer does not preserve executable bits. Restore them locally.
      - name: Restore Clang executable permissions
        run: |
          set -euo pipefail
          test -d clang/bin
          chmod -R a+x clang/bin
          test -x clang/bin/clang
          test -x clang/bin/ld.lld
          clang/bin/clang --version


      - name: Set Kernel Environment Variables
        run: |
          echo "KERNEL_TREE_BRANCH=${{ env.KERNEL_TREE_BRANCH_1 }}" >> $GITHUB_ENV
          
      - name: Checkout Kernel via PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [[ "${{ env.KERNEL_TREE_1 }}" == "private" ]]; then
            REPO_URL="https://x-access-token:${GH_PAT}@github.com/re-noroi/FD-private.git"
          else
            REPO_URL="${{ env.KERNEL_TREE_1 }}"
          fi
          git clone --no-checkout "${REPO_URL}" kernel_tree
          git -C kernel_tree fetch --depth=1 origin f7030790d0ac6545920528ffd22d79f4d37a5f1f
          git -C kernel_tree checkout --detach f7030790d0ac6545920528ffd22d79f4d37a5f1f
          test "$(git -C kernel_tree rev-parse HEAD)" = 'f7030790d0ac6545920528ffd22d79f4d37a5f1f'
          echo "Pinned known-bootable bpf-testing base: f7030790d0ac6545920528ffd22d79f4d37a5f1f" | tee "$GITHUB_WORKSPACE/source-version.txt"

      # Record the exact source revision and verify FLOS root-manager compatibility.
      - name: Verify FLOS source, KSU managers and NoMount 2.1
        working-directory: kernel_tree
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          {
            echo "### FLOS source revision"
            echo "- Commit: $SOURCE_SHA"
            git show -s --format="- Date: %cI%n- Subject: %s" HEAD
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          from pathlib import Path
          sig = Path("drivers/kernelsu/manager/apk_sign.c").read_text()
          checks = {
              "XXKSU dummy.keystore certificate": 'check_v2_signature(path, 0x363, "4359c171f32543394cbc23ef908c4bb94cad7c8087002ba164c8230948c21549")',
              "KOWX712 manager certificate": 'check_v2_signature(path, 0x375, "484fcba6e6c43b1fb09700633bf2fb4758f13cb0b2f4457b80d075084b26c588")',
              "MidoriSU manager certificate": 'check_v2_signature(path, 0x0368, "b9ee6759de4794f954883458b722b97ae6527cb7709a051db9a2348c0eea1e42")',
          }
          missing = [name for name, needle in checks.items() if needle not in sig]
          if missing:
              raise SystemExit("FLOS KSU manager compatibility check failed: " + ", ".join(missing))
          nomount = Path("fs/nomount/nomount.h").read_text()
          if '#define NOMOUNT_BASE_VERSION "21"' not in nomount:
              raise SystemExit("Expected bundled NoMount 2.1 source was not found.")
          print("PASS: FLOS accepts XXKSU, KOWX712 and MidoriSU manager signatures.")
          print("PASS: bundled NoMount 2.1 source is present.")
          PY

      # FLOS wakeup.c calls this SRCU-aware iterator but omits its local definition.
      # Restore the upstream Linux definition; the caller holds wakeup_srcu.
      - name: Restore SRCU-aware wakeup RCU iterator
        working-directory: kernel_tree
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("drivers/base/power/wakeup.c")
          text = path.read_text()
          macro = (
              "#define list_for_each_entry_rcu_locked(pos, head, member) \\\n"
              "\tlist_for_each_entry_rcu(pos, head, member, \\\n"
              "\t\tsrcu_read_lock_held(&wakeup_srcu))\n"
          )
          if text.count("#define list_for_each_entry_rcu_locked") > 1:
              raise SystemExit("Unexpected multiple definitions/usages of the wakeup RCU iterator")
          if "#define list_for_each_entry_rcu_locked" in text:
              print("PASS: SRCU-aware wakeup iterator already defined; no change needed.")
          else:
              anchor = '#include "power.h"\n'
              if text.count(anchor) != 1:
                  raise SystemExit('Cannot safely locate the unique #include "power.h" anchor')
              text = text.replace(anchor, anchor + "\n" + macro, 1)
              path.write_text(text)
              print("PASS: restored list_for_each_entry_rcu_locked() using srcu_read_lock_held(&wakeup_srcu).")
          PY
          grep -q '^#define list_for_each_entry_rcu_locked(pos, head, member)' drivers/base/power/wakeup.c
          grep -q 'srcu_read_lock_held(&wakeup_srcu)' drivers/base/power/wakeup.c
          git diff --check

      - name: Kernel Version
        run: |
          cd kernel_tree
          EXTRA=""
          if [[ "${{ env.VARIANT }}" == "W-variant" ]]; then
            EXTRA="-W"
          elif [[ "${{ env.VARIANT }}" == "oplus-variant" ]]; then
            EXTRA="-oplus"
          fi
          sed -i -e "s/CONFIG_LOCALVERSION=\"-FakeDreamer\"/CONFIG_LOCALVERSION=\"${{ env.CUSTOM_SED }}${EXTRA}\"/" arch/arm64/configs/vendor/alioth_defconfig

      - name: Remove cycle count
        if: ${{ env.REMOVE_CYCLE_COUNT == 'yes' }}
        run: |
          cd kernel_tree
          sed -i '/case POWER_SUPPLY_PROP_CYCLE_COUNT:/,/break;/c\
          \tcase POWER_SUPPLY_PROP_CYCLE_COUNT:\
          \t#ifdef CONFIG_BATT_VERIFY_BY_DS28E16\
          \t\tpval->intval = fg->maxim_cycle_count;\
          \t#else\
          \t\trc = get_cycle_count(chip->counter, &pval->intval);\
          \t#endif\
          \t\tbreak;' drivers/power/supply/qcom/qpnp-fg-gen4.c

      - name: Change different battery type
        if: matrix.kernel == 3 || matrix.kernel == 4
        run: |
          cd kernel_tree
          sed -i -e '/qcom,j3s-batt-profile;/d' arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi
          sed -i -e '/fg-gen4-batterydata-apollo-sun-5000mah.dtsi/d' arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi

      - name: Revert to stock gpufreq
        if: matrix.kernel == 3 || matrix.kernel == 4
        run: |
          cd kernel_tree
          patch -p1 -f < "0001-stock-gpu-freq.patch"

      - name: Disable MLGO flags for Neutron Clang
        if: ${{ env.COMPILER == 'neutron' }}
        run: |
          cd kernel_tree
          sed -i -e '/regalloc-enable-advisor/s/^/#/' -e '/enable-ml-inliner/s/^/#/' Makefile

      - name: Change LTO Type
        if: ${{ env.LTO_CHOICE == 'thin_lto' }}
        run: |
          cd kernel_tree
          sed -i -e '/# CONFIG_LTO_CLANG_THIN is not set/c\CONFIG_LTO_CLANG_THIN=y;' arch/arm64/configs/vendor/alioth_defconfig
          sed -i -e '/CONFIG_LTO_CLANG_FULL=y/c\# CONFIG_LTO_CLANG_FULL is not set;' arch/arm64/configs/vendor/alioth_defconfig

      - name: Oplus Features
        if: ${{ env.VARIANT == 'oplus-variant' }}
        run: |
          cd kernel_tree
          sed -i -e '/# CONFIG_OPLUS_PORT is not set/c\CONFIG_OPLUS_PORT=y;' arch/arm64/configs/vendor/alioth_defconfig

      - name: Apply Custom Feature Switches
        run: |
          cd kernel_tree
          DEFCONFIG="arch/arm64/configs/vendor/alioth_defconfig"
          
          chmod +x ./scripts/config

          # Function to toggle configs and echo the status
          toggle_config() {
            local feature=$1
            local state=$2
            
            if [[ "$state" == 'true' ]]; then
              echo "  [+] Enabling $feature"
              ./scripts/config --file $DEFCONFIG --enable "$feature"
            else
              echo "  [-] Disabling $feature"
              ./scripts/config --file $DEFCONFIG --disable "$feature"
            fi
          }

          echo "==== Applying Extra Features ===="
          toggle_config "CONFIG_NTSYNC" "${{ env.ENABLE_NTSYNC }}"
          toggle_config "CONFIG_NOMOUNT" "${{ env.ENABLE_NOMOUNT }}"
          # IPA wakelocks must remain enabled; this symbol disables them when set.
          toggle_config "CONFIG_DISABLE_IPA_WAKELOCKS" "false"
          toggle_config "CONFIG_RW_SWAPPINESS" "${{ env.ENABLE_RW_SWAPPINESS }}"
          toggle_config "CONFIG_BYPASS_CHARGING" "${{ env.ENABLE_BYPASS_CHARGING }}"
          echo "================================="

      - name: Apply Modifications (if modified build)
        if: matrix.kernel == 2 || matrix.kernel == 4
        run: |
          cd kernel_tree
          sed -i -e '/<2553600>,/c\<2553600>;' arch/arm64/boot/dts/vendor/qcom/kona.dtsi
          sed -i -e '/<2649600>,/c\//<2649600>,' arch/arm64/boot/dts/vendor/qcom/kona.dtsi
          sed -i -e '/<2745600>,/c\//<2745600>,' arch/arm64/boot/dts/vendor/qcom/kona.dtsi
          sed -i -e '/<2841600>,/c\//<2841600>,' arch/arm64/boot/dts/vendor/qcom/kona.dtsi
          sed -i -e '/<3187200>;/c\//<3187200>;' arch/arm64/boot/dts/vendor/qcom/kona.dtsi
          sed -i -e 's/qcom,mdss-pan-physical-width-dimension = <70>;/qcom,mdss-pan-physical-width-dimension = <695>;/' arch/arm64/boot/dts/vendor/qcom/dsi-panel-k11a-38-08-0a-dsc-cmd.dtsi
          sed -i -e 's/qcom,mdss-pan-physical-height-dimension = <155>;/qcom,mdss-pan-physical-height-dimension = <1546>;/' arch/arm64/boot/dts/vendor/qcom/dsi-panel-k11a-38-08-0a-dsc-cmd.dtsi
      
      # Minimal IPA wake-source fix copied from the working Raikiri 1.7 implementation.
      # The FakeDreamer counter previously changed without holding/releasing the wake source.
      - name: Restore IPA wake-source acquire and release
        working-directory: kernel_tree
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("drivers/platform/msm/ipa/ipa_v3/ipa.c")
          text = path.read_text()
          inc = "ipa3_ctx->wakelock_ref_cnt.cnt++;"
          dec = "ipa3_ctx->wakelock_ref_cnt.cnt--;"

          inc_fix = inc + """
          \tif (ipa3_ctx->wakelock_ref_cnt.cnt == 1)
          \t\t__pm_stay_awake(ipa3_ctx->w_lock);"""
          dec_fix = dec + """
          \tif (ipa3_ctx->wakelock_ref_cnt.cnt == 0)
          \t\t__pm_relax(ipa3_ctx->w_lock);"""

          if text.count(inc_fix) == 1 and text.count(dec_fix) == 1:
              print("PASS: IPA wake-source fix is already present.")
          elif text.count(inc) == 1 and text.count(dec) == 1:
              if "__pm_stay_awake(ipa3_ctx->w_lock)" in text or "__pm_relax(ipa3_ctx->w_lock)" in text:
                  raise SystemExit("Partial IPA wake-source patch detected; refusing to guess.")
              # pm_wakeup.h requires linux/device.h to have been included first.
              if '#include <linux/pm_wakeup.h>' not in text:
                  device_include = '#include <linux/device.h>\n'
                  if text.count(device_include) != 1:
                      raise SystemExit("Cannot safely locate unique linux/device.h include.")
                  text = text.replace(device_include, device_include + '#include <linux/pm_wakeup.h>\n', 1)
              text = text.replace(inc, inc_fix, 1).replace(dec, dec_fix, 1)
              path.write_text(text)
              print("PATCHED: first IPA client now calls __pm_stay_awake(); last client calls __pm_relax().")
          else:
              raise SystemExit(
                  "Unexpected IPA wakelock source state: "
                  f"inc={text.count(inc)}, dec={text.count(dec)}, "
                  f"inc_fix={text.count(inc_fix)}, dec_fix={text.count(dec_fix)}"
              )

          verify = path.read_text()
          if '#include <linux/pm_wakeup.h>' not in verify:
              raise SystemExit("IPA wakeup header include verification failed.")
          if verify.count("__pm_stay_awake(ipa3_ctx->w_lock)") != 1:
              raise SystemExit("IPA acquire verification failed.")
          if verify.count("__pm_relax(ipa3_ctx->w_lock)") != 1:
              raise SystemExit("IPA release verification failed.")
          if verify.count('wakeup_source_register(&ipa_pdev->dev, "IPA_WS")') != 1:
              raise SystemExit("Expected existing IPA wake-source registration was not found.")
          PY
          git diff --check
          grep -n -A3 -B2 '__pm_stay_awake(ipa3_ctx->w_lock)' drivers/platform/msm/ipa/ipa_v3/ipa.c
          grep -n -A3 -B2 '__pm_relax(ipa3_ctx->w_lock)' drivers/platform/msm/ipa/ipa_v3/ipa.c

      - name: Build Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="renoroi"
          export KBUILD_BUILD_HOST="dreamstate"
          export KBUILD_BUILD_TIMESTAMP="$(TZ=UTC-7 date)"
          cd kernel_tree
          make O=out vendor/alioth_defconfig
          grep -qx 'CONFIG_KSU=y' out/.config || { echo 'ERROR: in-tree KernelSU is not enabled'; exit 1; }
          grep -qx 'CONFIG_NOMOUNT=y' out/.config || { echo 'ERROR: bundled NoMount 2.1 is not enabled'; exit 1; }
          ! grep -qx 'CONFIG_DISABLE_IPA_WAKELOCKS=y' out/.config || { echo 'ERROR: IPA wake locks are disabled; VoWiFi power fix would be inactive.'; exit 1; }
          make O=out CC=clang HOSTCC=gcc HOSTCXX=g++ -j$(nproc --all) CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1
          if [[ "${{ matrix.kernel }}" == 1 ]]; then
            cp out/arch/arm64/boot/Image.gz ../Image.gz
            mv out/arch/arm64/boot/dtbo.img ../alioth-j3s-dtbo-aosp.img
            mv out/arch/arm64/boot/dtb.img ../alioth-normal-dtb
          elif [[ "${{ matrix.kernel }}" == 2 ]]; then
            mv out/arch/arm64/boot/dtbo.img ../alioth-j3s-dtbo-miui.img
            mv out/arch/arm64/boot/dtb.img ../alioth-effcpu-dtb
          elif [[ "${{ matrix.kernel }}" == 3 ]]; then
            mv out/arch/arm64/boot/dtb.img ../alioth-normal-gpustk-dtb
            mv out/arch/arm64/boot/dtbo.img ../alioth-stock-dtbo-aosp.img
          else
            mv out/arch/arm64/boot/dtb.img ../alioth-effcpu-gpustk-dtb
            mv out/arch/arm64/boot/dtbo.img ../alioth-stock-dtbo-miui.img
          fi

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-1-${{ matrix.kernel }}
          path: |
            *.img
            *-dtb
            Image.gz

  package_anykernel:
    needs: build
    runs-on: ubuntu-latest
    env:
      ANYKERNEL_URL: ${{ github.event.inputs.ANYKERNEL_URL || 'https://github.com/re-noroi/anykernel3-test' }}
      CODENAME: ${{ github.event.inputs.CODENAME || 'alioth' }}
      VARIANT: ${{ github.event.inputs.VARIANT || 'W-variant' }}

    steps:
      - name: Download Kernel Build Original
        uses: actions/download-artifact@v4
        with:
          name: kernel-1-1
          path: kernel-1-1

      - name: Download Kernel Build Modified
        uses: actions/download-artifact@v4
        with:
          name: kernel-1-2
          path: kernel-1-2

      - name: Download Kernel Build Stock + Stock GPU
        uses: actions/download-artifact@v4
        with:
          name: kernel-1-3
          path: kernel-1-3

      - name: Download Kernel Build Effcpu + Stock GPU
        uses: actions/download-artifact@v4
        with:
          name: kernel-1-4
          path: kernel-1-4

      - name: Clone AnyKernel3
        run: git clone --recursive --depth=1 ${{ env.ANYKERNEL_URL }} -b main AnyKernel3-1

      - name: Verify AnyKernel vendor_boot ramdisk installation is preserved
        run: |
          set -euo pipefail
          grep -q '^## vendor_boot shell variables$' AnyKernel3-1/anykernel.sh
          grep -q '^# vendor_boot install$' AnyKernel3-1/anykernel.sh
          test "$(grep -c '^write_boot;' AnyKernel3-1/anykernel.sh)" -eq 2
          echo "PASS: boot and vendor_boot each retain their own dump/write cycle."

      - name: Move Kernel Files to AnyKernel3
        run: |
          mv kernel-1-1/* AnyKernel3-1/
          mv kernel-1-2/* AnyKernel3-1/
          mv kernel-1-3/* AnyKernel3-1/
          mv kernel-1-4/* AnyKernel3-1/

      - name: Set exact J3S MIUI efficient CPU + UV marker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("AnyKernel3-1")
          for p in root.glob("*.dreamless"):
              p.unlink()
          marker = root / "j3s-miui-eff-uv.dreamless"
          marker.touch()
          assert marker.is_file() and marker.stat().st_size == 0
          print("PASS: j3s-miui-eff-uv.dreamless")
          PY

      - name: Create and validate recovery-flashable ZIP
        id: zip
        run: |
          set -euo pipefail
          ZIP_NAME="FakeDreamer-alioth-$(date -u +%Y%m%d)-W-j3s-miui-eff-uv.zip"
