name: Raikiri v1.7 - original MIUI5K battery preflight

on:
  push:
    branches:
      - Raikiri-Midori-NM
    paths:
      - '.github/workflows/raikiri-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Inspect pinned Raikiri source
        shell: bash
        run: |
          set -euo pipefail
          REPO="https://github.com/Sayemx18/kernel_xiaomi_sm8250.git"
          PIN="4d8105023e3d1474323f4118abc3b4ce6485070d"
          git clone --no-checkout "$REPO" kernel
          git -C kernel checkout --detach "$PIN"
          test "$(git -C kernel rev-parse HEAD)" = "$PIN"

          echo "## Original Raikiri v1.7 battery DTS preservation" | tee preflight-report.md
          git -C kernel diff --exit-code -- arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi arch/arm64/boot/dts/vendor/qcom/fg-gen4-batterydata-alioth-FMT-4520mah.dtsi arch/arm64/boot/dts/vendor/qcom/fg-gen4-batterydata-alioth-GY-4520mah.dtsi
          grep -nE 'alioth_batterydata:|fg-gen4-batterydata-alioth-(FMT|GY)-4520mah' kernel/arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi | tee -a preflight-report.md
                              echo "PASS: original Raikiri v1.7 alioth battery DTS retained unchanged." | tee -a preflight-report.md

          {
            echo
            echo "# Raikiri v1.7 compatibility preflight"
            echo
            echo "- Source: Sayemx18/kernel_xiaomi_sm8250"
            echo "- Pinned commit: $PIN"
            echo "- Kernel version: $(sed -n 's/^SUBLEVEL = /4.19./p' kernel/Makefile)"
            echo
            echo "## Device and original Raikiri battery configuration"
            grep -nE 'alioth_batterydata:|fg-gen4-batterydata-alioth-(FMT|GY)-4520mah|qcom,battery-data' kernel/arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi || true
            grep -nE 'qcom,(k11a-batt-profile|sun-profile-only|five-pin-battery)' kernel/arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi || true
            grep -nE 'nom-batt-capacity-mah|battery-type|six-pin|five-pin' kernel/arch/arm64/boot/dts/vendor/qcom/fg-gen4-batterydata-alioth-FMT-4520mah.dtsi kernel/arch/arm64/boot/dts/vendor/qcom/fg-gen4-batterydata-alioth-GY-4520mah.dtsi || true
            echo
            echo "## Kernel config fragments"
            grep -nE 'CONFIG_(KSU|KSU_MANUAL_HOOK|NOMOUNT|MIDORI|SUSFS)' kernel/arch/arm64/configs/vendor/xiaomi/raikiri.config kernel/arch/arm64/configs/alioth_defconfig kernel/arch/arm64/configs/vendor/xiaomi/alioth.config || true
            echo
            echo "## Source references for CP5, MidoriSU, NoMount and legacy KSU"
            if git -C kernel grep -n -i -E 'cp5|midori.?su|no.?mount|ksu.?legacy' "$PIN" -- ':!*.patch' ; then
              true
            else
              echo "No matching implementation references found by git grep."
            fi
            echo
            echo "## Build safety"
            echo "This job verifies the pinned original Raikiri battery DTS is unchanged. It does not build a kernel/DTBO or produce a flashable ZIP."
          } | tee -a preflight-report.md

      - name: Upload original battery preflight report
        uses: actions/upload-artifact@v4
        with:
          name: raikiri-v17-preflight
          path: preflight-report.md
