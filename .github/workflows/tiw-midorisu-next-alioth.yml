name: Tiw MidoriSU (next) - alioth J3S 5000 mAh test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libelf-dev libncurses-dev libssl-dev lz4 python3 rsync

      - name: Download LLVM toolchain
        run: |
          set -euo pipefail
          wget -q 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/747f0cceb48f48bf7cf497a3e01af1389266904b/clang-r614150.tar.gz' -O clang.tar.gz
          mkdir clang
          tar -xzf clang.tar.gz -C clang
          test -x clang/bin/clang
          clang/bin/clang --version

      - name: Checkout pinned alioth kernel and replace KSU submodule with MidoriSU next
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Sayemx18/kernel_xiaomi_sm8250.git kernel
          git -C kernel checkout --detach 4d8105023e3d1474323f4118abc3b4ce6485070d
          test "$(git -C kernel rev-parse HEAD)" = '4d8105023e3d1474323f4118abc3b4ce6485070d'
          git -C kernel submodule update --init --recursive
          test -e kernel/KernelSU-Next/.git
          git -C kernel/KernelSU-Next remote set-url origin https://github.com/midori01/KernelSU.git
          git -C kernel/KernelSU-Next fetch --depth=1 origin refs/heads/next
          MIDORISU_COMMIT="$(git -C kernel/KernelSU-Next rev-parse FETCH_HEAD)"
          test -n "$MIDORISU_COMMIT"
          git -C kernel/KernelSU-Next checkout --detach "$MIDORISU_COMMIT"
          test -f kernel/KernelSU-Next/kernel/Kconfig
          test -f kernel/drivers/kernelsu/Kconfig
          grep -q 'config KSU' kernel/KernelSU-Next/kernel/Kconfig
          grep -q 'depends on KPROBES && EXT4_FS' kernel/KernelSU-Next/kernel/Kconfig
          echo "$MIDORISU_COMMIT" | tee midorisu-commit.txt
          echo "MidoriSU next commit: $MIDORISU_COMMIT"

      - name: Integrate pinned NoMount 2.2-compatible source (legacy 4.19 built-in)
        run: |
          set -euo pipefail
          NOMOUNT_COMMIT='bf1847f98fed382369c43bfd652cd93774b9b8e3'
          git clone --no-checkout https://github.com/maxsteeel/nomount.git NoMount
          git -C NoMount fetch --depth=1 origin "$NOMOUNT_COMMIT"
          git -C NoMount checkout --detach "$NOMOUNT_COMMIT"
          test "$(git -C NoMount rev-parse HEAD)" = "$NOMOUNT_COMMIT"
          test -s NoMount/kernel/src/nomount.c
          test -s NoMount/kernel/src/Kconfig
          test -s NoMount/kernel/src/Makefile
          ln -s "$GITHUB_WORKSPACE/NoMount/kernel/src" "$GITHUB_WORKSPACE/kernel/fs/nomount"
          grep -qF 'obj-$(CONFIG_NOMOUNT) += nomount/' kernel/fs/Makefile || \
            printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> kernel/fs/Makefile
          python3 - <<'PY'
          from pathlib import Path
          p = Path("kernel/fs/Kconfig")
          s = p.read_text()
          entry = 'source "fs/nomount/Kconfig"'
          if entry not in s:
              pos = s.rfind("\nendmenu")
              if pos < 0:
                  raise SystemExit("ERROR: fs/Kconfig has no endmenu insertion point")
              s = s[:pos] + "\n" + entry + s[pos:]
              p.write_text(s)
          PY
          git -C kernel diff --check

      - name: Prepare and verify J3S 5000 mAh DTS
        run: |
          set -euo pipefail
          python3 scripts/prepare_raikiri_j3s.py kernel
          git -C kernel diff --check

      - name: Configure MidoriSU Kprobes driver and NoMount
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          # MidoriSU's "next" branch does not expose the old KSU_MANUAL_HOOK
          # option. Remove that stale fragment and use its declared KPROBES path.
          sed -i '/^CONFIG_KSU_MANUAL_HOOK=/d' arch/arm64/configs/vendor/xiaomi/raikiri.config

          make O=out alioth_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/xiaomi/sm8250-common.config \
            arch/arm64/configs/vendor/xiaomi/alioth.config \
            arch/arm64/configs/vendor/xiaomi/raikiri.config

          scripts/config --file out/.config -e KPROBES -e EXT4_FS -e KSU -e NOMOUNT -d KSU_SUSFS
          make O=out olddefconfig

          grep -qx 'CONFIG_MACH_XIAOMI_ALIOTH=y' out/.config
          grep -qx 'CONFIG_KPROBES=y' out/.config
          grep -qx 'CONFIG_EXT4_FS=y' out/.config
          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_NOMOUNT=y' out/.config
          grep -qx 'CONFIG_LOCALVERSION="-Raikiri-v1.7"' out/.config
          if grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config; then
            echo 'ERROR: stale KernelSU Next manual-hook option survived MidoriSU config' >&2
            exit 1
          fi

          {
            echo '## MidoriSU test configuration'
            grep -E '^(CONFIG_MACH_XIAOMI_ALIOTH|CONFIG_KPROBES=|CONFIG_EXT4_FS=|CONFIG_KSU=|CONFIG_NOMOUNT=|CONFIG_KSU_SUSFS=|CONFIG_LOCALVERSION=)' out/.config
          } | tee "$GITHUB_WORKSPACE/config-report.txt"

      - name: Build Image.gz, DTBs and DTBO
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER='Tinieblass'
          export KBUILD_BUILD_HOST='GitHub-Actions'
          make O=out CC=clang LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image.gz dtbs dtbo.img

      - name: Verify outputs and create build report
        run: |
          set -euo pipefail
          BOOT=kernel/out/arch/arm64/boot
          test -s "$BOOT/Image.gz"
          test -s "$BOOT/dtbo.img"
          test -s "$BOOT/dts/vendor/qcom/alioth-sm8250-overlay.dtbo"
          test -s "$BOOT/dts/vendor/qcom/kona.dtb"
          test -s "$BOOT/dts/vendor/qcom/kona-v2.dtb"
          test -s "$BOOT/dts/vendor/qcom/kona-v2.1.dtb"

          mkdir -p tiw-midorisu-output
          cp "$BOOT/Image.gz" "$BOOT/dtbo.img" "$BOOT/dts/vendor/qcom/alioth-sm8250-overlay.dtbo" tiw-midorisu-output/
          cp "$BOOT/dts/vendor/qcom/kona.dtb" "$BOOT/dts/vendor/qcom/kona-v2.dtb" "$BOOT/dts/vendor/qcom/kona-v2.1.dtb" tiw-midorisu-output/
          cp config-report.txt midorisu-commit.txt tiw-midorisu-output/
          {
            echo '# Tiw MidoriSU next - alioth experimental build'
            echo
            echo '- Device: POCO F3 / alioth'
            echo '- Kernel source: Sayemx18/kernel_xiaomi_sm8250'
            echo '- Kernel source commit: 4d8105023e3d1474323f4118abc3b4ce6485070d'
            echo '- MidoriSU source: midori01/KernelSU, branch next (resolved commit in midorisu-commit.txt)'
            echo '- Hook/config path: KPROBES + EXT4_FS; legacy KSU_MANUAL_HOOK removed'
            echo '- NoMount source commit: bf1847f98fed382369c43bfd652cd93774b9b8e3'
            echo '- Battery profile: J3S Sun 5000 mAh; CP5 is not modified or included'
            echo '- Output is raw build material only; no flashable ZIP is generated and no device is flashed.'
            echo '- Build success does not establish boot, root-manager, module-mount or IMS/VoWiFi compatibility.'
          } > tiw-midorisu-output/BUILD-REPORT.md
          (cd tiw-midorisu-output && sha256sum * > SHA256SUMS.txt)

      - name: Upload raw experimental artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tiw-midorisu-next-alioth-j3s-raw
          path: tiw-midorisu-output/
          if-no-files-found: error
          compression-level: 0
