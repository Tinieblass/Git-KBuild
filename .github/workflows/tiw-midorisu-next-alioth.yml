name: Tiw Backslashxx KernelSU v3.3.1-34 - alioth J3S 5000 mAh
# Diagnostic build: two jobs, captured output, and preserved exit status.

on:
  workflow_dispatch:
  push:
    branches:
      - Tiw-MidoriSU-NX-alioth-test
    paths:
      - .github/workflows/tiw-midorisu-next-alioth.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libelf-dev libncurses-dev libssl-dev lz4 python3 rsync zip

      - name: Download LLVM toolchain
        run: |
          set -euo pipefail
          wget -q 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/747f0cceb48f48bf7cf497a3e01af1389266904b/clang-r614150.tar.gz' -O clang.tar.gz
          mkdir clang
          tar -xzf clang.tar.gz -C clang
          test -x clang/bin/clang
          clang/bin/clang --version

      - name: Checkout pinned alioth kernel and Backslashxx KernelSU legacy driver
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Sayemx18/kernel_xiaomi_sm8250.git kernel
          git -C kernel checkout --detach 4d8105023e3d1474323f4118abc3b4ce6485070d
          test "$(git -C kernel rev-parse HEAD)" = '4d8105023e3d1474323f4118abc3b4ce6485070d'

          # Replace the Backslashxx KernelSU submodule with Backslashxx's in-tree legacy driver.
          git -C kernel submodule deinit -f --all || true
          rm -rf kernel/KernelSU-Next
          git clone --no-checkout https://github.com/backslashxx/KernelSU.git kernel/KernelSU-Next
          git -C kernel/KernelSU-Next checkout --detach 9b74de40162dea776d461c15946aae4064c85e5f
          KSU_COMMIT="$(git -C kernel/KernelSU-Next rev-parse HEAD)"
          test "$KSU_COMMIT" = '9b74de40162dea776d461c15946aae4064c85e5f'
          test -f kernel/KernelSU-Next/kernel/Kconfig
          test -f kernel/KernelSU-Next/kernel/Makefile
          test -f kernel/drivers/kernelsu/Kconfig
          grep -q 'config KSU' kernel/KernelSU-Next/kernel/Kconfig
          grep -q 'config KSU_HACK_ARM64_BRANCH_LINK' kernel/KernelSU-Next/kernel/Kconfig
          echo "$KSU_COMMIT" | tee ksu-commit.txt
          echo "Backslashxx KernelSU commit: $KSU_COMMIT"

      - name: Integrate pinned NoMount 2.2-compatible source (legacy 4.19 built-in)
        run: |
          set -euo pipefail
          NOMOUNT_COMMIT='bf1847f98fed382369c43bfd652cd93774b9b8e3'
          git clone --no-checkout https://github.com/maxsteeel/nomount.git NoMount
          git -C NoMount fetch --depth=1 origin "$NOMOUNT_COMMIT"
          git -C NoMount checkout --detach "$NOMOUNT_COMMIT"
          test "$(git -C NoMount rev-parse HEAD)" = "$NOMOUNT_COMMIT"
          test -s NoMount/kernel/src/nomount.c
          test -s NoMount/kernel/src/Kconfig
          test -s NoMount/kernel/src/Makefile
          ln -s "$GITHUB_WORKSPACE/NoMount/kernel/src" "$GITHUB_WORKSPACE/kernel/fs/nomount"
          grep -qF 'obj-$(CONFIG_NOMOUNT) += nomount/' kernel/fs/Makefile || \
            printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> kernel/fs/Makefile
          python3 - <<'PY'
          from pathlib import Path
          p = Path("kernel/fs/Kconfig")
          s = p.read_text()
          entry = 'source "fs/nomount/Kconfig"'
          if entry not in s:
              pos = s.rfind("\nendmenu")
              if pos < 0:
                  raise SystemExit("ERROR: fs/Kconfig has no endmenu insertion point")
              s = s[:pos] + "\n" + entry + s[pos:]
              p.write_text(s)
          PY
          git -C kernel diff --check

      - name: Prepare and verify J3S 5000 mAh DTS
        run: |
          set -euo pipefail
          python3 scripts/prepare_raikiri_j3s.py kernel
          git -C kernel diff --check

      - name: Configure Backslashxx KernelSU legacy hooks and NoMount
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          make O=out alioth_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/xiaomi/sm8250-common.config \
            arch/arm64/configs/vendor/xiaomi/alioth.config \
            arch/arm64/configs/vendor/xiaomi/raikiri.config

          # Backslashxx's ARM64 branch-link hook is the recommended path for 4.19+.
          scripts/config --file out/.config -e KSU -e KSU_HACK_ARM64_BRANCH_LINK \
            -e KSU_LSM_SECURITY_HOOKS -e NOMOUNT \
            -d KSU_TAMPER_SYSCALL_TABLE -d KSU_KPROBES_KSUD
          make O=out olddefconfig

          grep -qx 'CONFIG_MACH_XIAOMI_ALIOTH=y' out/.config
          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y' out/.config
          grep -qx 'CONFIG_KSU_LSM_SECURITY_HOOKS=y' out/.config
          grep -qx 'CONFIG_NOMOUNT=y' out/.config
          grep -qx 'CONFIG_LOCALVERSION="-Raikiri-v1.7"' out/.config

          {
            echo '## Backslashxx KernelSU v3.3.1-34 legacy configuration'
            grep -E '^(CONFIG_MACH_XIAOMI_ALIOTH|CONFIG_KSU=|CONFIG_KSU_HACK_ARM64_BRANCH_LINK=|CONFIG_KSU_LSM_SECURITY_HOOKS=|CONFIG_NOMOUNT=|CONFIG_LOCALVERSION=)' out/.config
          } | tee "$GITHUB_WORKSPACE/config-report.txt"

      - name: Build Image.gz, DTBs and DTBO
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER='Tinieblass'
          export KBUILD_BUILD_HOST='GitHub-Actions'
          BUILD_LOG="$GITHUB_WORKSPACE/kernel-build.log"
          echo "Build started with 2 parallel jobs; full output: $BUILD_LOG"
          make O=out CC=clang LLVM=1 LLVM_IAS=1 -j2 Image.gz dtbs dtbo.img >"$BUILD_LOG" 2>&1 || {
            rc=$?
            echo "Kernel build failed; last 250 log lines follow:"
            tail -n 250 "$BUILD_LOG" || true
            exit "$rc"
          }
          echo "Kernel build completed successfully."
          tail -n 80 "$BUILD_LOG"

      - name: Upload build diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiw-backslashxx-alioth-build-log
          path: kernel-build.log
          if-no-files-found: ignore
          compression-level: 6

      - name: Download matching Backslashxx Manager APK
        run: |
          set -euo pipefail
          mkdir -p tiw-backslashxx-output
          curl -fL 'https://github.com/backslashxx/KernelSU/releases/download/v3.3.1-34/KernelSU_v3.3.1-34_32714-release.apk' -o tiw-backslashxx-output/KernelSU-Manager-v3.3.1-34.apk
          echo '8d8d47468439de2261b3cddbccace904e9dca1c6fd28f2c8c46231d1d36aac79  tiw-backslashxx-output/KernelSU-Manager-v3.3.1-34.apk' | sha256sum -c -

      - name: Verify outputs and create build report
        run: |
          set -euo pipefail
          BOOT=kernel/out/arch/arm64/boot
          test -s "$BOOT/Image.gz"
          test -s "$BOOT/dtbo.img"
          test -s "$BOOT/dts/vendor/qcom/alioth-sm8250-overlay.dtbo"
          test -s "$BOOT/dts/vendor/qcom/kona.dtb"
          test -s "$BOOT/dts/vendor/qcom/kona-v2.dtb"
          test -s "$BOOT/dts/vendor/qcom/kona-v2.1.dtb"

          mkdir -p tiw-backslashxx-output
          cp "$BOOT/Image.gz" "$BOOT/dtbo.img" "$BOOT/dts/vendor/qcom/alioth-sm8250-overlay.dtbo" tiw-backslashxx-output/
          cp "$BOOT/dts/vendor/qcom/kona.dtb" "$BOOT/dts/vendor/qcom/kona-v2.dtb" "$BOOT/dts/vendor/qcom/kona-v2.1.dtb" tiw-backslashxx-output/
          cp config-report.txt ksu-commit.txt tiw-backslashxx-output/
          {
            echo '# Tiw Backslashxx KernelSU v3.3.1-34 - alioth experimental build'
            echo
            echo '- Device: POCO F3 / alioth'
            echo '- Kernel source: Sayemx18/kernel_xiaomi_sm8250'
            echo '- Kernel source commit: 4d8105023e3d1474323f4118abc3b4ce6485070d'
            echo '- KernelSU source: backslashxx/KernelSU @ 9b74de40162dea776d461c15946aae4064c85e5f (v3.3.1-34)'
            echo '- Hook/config path: KSU_HACK_ARM64_BRANCH_LINK + KSU_LSM_SECURITY_HOOKS (Backslashxx legacy 4.19 mode)'
            echo '- NoMount source commit: bf1847f98fed382369c43bfd652cd93774b9b8e3'
            echo '- Battery profile: J3S Sun 5000 mAh; CP5 is not modified or included'
            echo '- Raw build material and an AnyKernel3 ZIP candidate are generated; no device is flashed by CI.'
            echo '- Build success does not establish boot, root-manager, module-mount or IMS/VoWiFi compatibility.'
          } > tiw-backslashxx-output/BUILD-REPORT.md
          (cd tiw-backslashxx-output && sha256sum * > SHA256SUMS.txt)

      - name: Upload raw experimental artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tiw-backslashxx-alioth-j3s-raw
          path: tiw-backslashxx-output/
          if-no-files-found: error
          compression-level: 0

      - name: Build AnyKernel3 flashable ZIP for alioth MIUI5K
        run: |
          set -euo pipefail
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          git -C anykernel checkout --detach 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
          test "$(git -C anykernel rev-parse HEAD)" = '41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1'
          rm -rf anykernel/.git anykernel/.github anykernel/README.md
          cp tiw-backslashxx-output/Image.gz anykernel/Image.gz
          cp tiw-backslashxx-output/dtbo.img anykernel/dtbo.img
          cp tiw-backslashxx-output/KernelSU-Manager-v3.3.1-34.apk anykernel/
          cat > anykernel/anykernel.sh <<'AK3'
          ### Raikiri v1.7 - POCO F3 / alioth - Backslashxx KernelSU v3.3.1-34 - MIUI5K
          ## Experimental package for HyperOS 3 / Android 16.

          properties() { '
          kernel.string=Raikiri v1.7 Backslashxx-KSU v3.3.1-34 J3S Sun 5000mAh -miui5k
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=alioth
          supported.versions=16
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          # Keep the existing boot ramdisk and replace only the kernel image.
          dump_boot;
          cp -f dtbo.img dtbo$SLOT.img;
          flash_generic dtbo$SLOT;
          repack_ramdisk;
          flash_boot;
          AK3
          (cd anykernel && zip -qr9 ../Raikiri-v1.7-alioth-backslashxx-miui5k.zip . -x '.git/*' '.github/*' 'README.md')

      - name: Validate flashable ZIP structure
        run: |
          set -euo pipefail
          unzip -t Raikiri-v1.7-alioth-backslashxx-miui5k.zip
          unzip -l Raikiri-v1.7-alioth-backslashxx-miui5k.zip | grep -E 'anykernel.sh|tools/ak3-core.sh|tools/magiskboot|Image.gz|dtbo.img|KernelSU-Manager|LICENSE'
          unzip -p Raikiri-v1.7-alioth-backslashxx-miui5k.zip anykernel.sh | grep -q 'device.name1=alioth'
          unzip -p Raikiri-v1.7-alioth-backslashxx-miui5k.zip anykernel.sh | grep -q 'IS_SLOT_DEVICE=1'
          unzip -p Raikiri-v1.7-alioth-backslashxx-miui5k.zip anykernel.sh | grep -q 'flash_boot'
          unzip -p Raikiri-v1.7-alioth-backslashxx-miui5k.zip anykernel.sh | grep -Fq 'flash_generic dtbo$SLOT'
          sha256sum Raikiri-v1.7-alioth-backslashxx-miui5k.zip

      - name: Upload flashable ZIP candidate
        uses: actions/upload-artifact@v4
        with:
          name: Raikiri-v1.7-alioth-backslashxx-miui5k-candidate
          path: Raikiri-v1.7-alioth-backslashxx-miui5k.zip
          if-no-files-found: error
          compression-level: 0
