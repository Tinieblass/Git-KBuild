name: FakeDreamer FLOS 2.2-rc2 - alioth J3S 5000mAh + NoMount 2.2

on:
  workflow_dispatch:
  push:
    branches:
      - Tiw-MidoriSU-NX-alioth-test
    paths:
      - .github/workflows/fakedreamer-flos22-alioth.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libelf-dev libncurses-dev libssl-dev lz4 python3 rsync zip

      - name: Download FakeDreamer FLOS 2.2-rc2 source
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/re-noroi/kernel_sm8250.git kernel
          git -C kernel fetch --depth=1 origin 1088c7141c6039cc2238798fdc13e6f1d7c9411c
          git -C kernel checkout --detach 1088c7141c6039cc2238798fdc13e6f1d7c9411c
          test "$(git -C kernel rev-parse HEAD)" = '1088c7141c6039cc2238798fdc13e6f1d7c9411c'
          grep -q 'CONFIG_BOARD_ALIOTH=y' kernel/arch/arm64/configs/vendor/alioth_defconfig
          grep -q 'CONFIG_LOCALVERSION="-FakeDreamer-flos-W"' kernel/arch/arm64/configs/vendor/alioth_defconfig
          grep -q 'CONFIG_CGROUP_BPF=y' kernel/arch/arm64/configs/vendor/alioth_defconfig
          grep -q 'CONFIG_BPF_SYSCALL=y' kernel/arch/arm64/configs/vendor/alioth_defconfig
          grep -q 'CONFIG_KSU=y' kernel/arch/arm64/configs/vendor/alioth_defconfig
          echo 'FakeDreamer FLOS W commit: 1088c7141c6039cc2238798fdc13e6f1d7c9411c' | tee source-version.txt

      - name: Update bundled NoMount 2.1 to NoMount v2.2.0
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/maxsteeel/nomount.git NoMount
          git -C NoMount fetch --depth=1 origin refs/tags/v2.2.0
          git -C NoMount checkout --detach FETCH_HEAD
          test -s NoMount/kernel/src/nomount.c
          test -s NoMount/kernel/src/nomount.h
          test -s NoMount/kernel/src/Kconfig
          test -s NoMount/kernel/src/Makefile
          rm -rf kernel/fs/nomount
          mkdir -p kernel/fs/nomount
          cp -a NoMount/kernel/src/. kernel/fs/nomount/
          grep -q 'NOMOUNT_BASE_VERSION "22"' kernel/fs/nomount/nomount.h
          grep -q 'default y' kernel/fs/nomount/Kconfig
          echo "NoMount v2.2.0 commit: $(git -C NoMount rev-parse HEAD)" | tee nomount-version.txt

      - name: Verify native J3S Sun 5000mAh battery profile
        working-directory: kernel
        run: |
          set -euo pipefail
          DTS=arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi
          BAT=arch/arm64/boot/dts/vendor/qcom/fg-gen4-batterydata-apollo-sun-5000mah.dtsi
          grep -Fq 'qcom,j3s-batt-profile;' "$DTS"
          grep -Fq 'fg-gen4-batterydata-apollo-sun-5000mah.dtsi' "$DTS"
          grep -Fq 'qcom,nom-batt-capacity-mah = <5000>;' "$BAT"
          grep -Fq 'qcom,battery-type = "j3ssun_5000mah";' "$BAT"
          git diff --check
          echo 'Native J3S Sun 5000mAh profile verified; DTS left unchanged.'

      - name: Download matching Clang toolchain
        run: |
          set -euo pipefail
          wget -q 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/603a89415bbb04dff8bc577b95534479ec13fdc5/clang-r574158.tar.gz' -O clang.tar.gz
          mkdir clang
          tar -xzf clang.tar.gz -C clang
          test -x clang/bin/clang
          clang/bin/clang --version

      - name: Configure FLOS with NoMount enabled
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out vendor/alioth_defconfig
          scripts/config --file out/.config \
            --set-str LOCALVERSION '-FakeDreamer-flos-W-J3S5000-NM2.2-KSU-bpf' \
            -e NOMOUNT -e KSU -e BPF -e BPF_SYSCALL -e BPF_JIT -e BPF_JIT_ALWAYS_ON
          make O=out olddefconfig
          grep -qx 'CONFIG_BOARD_ALIOTH=y' out/.config
          grep -qx 'CONFIG_NOMOUNT=y' out/.config
          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_BPF=y' out/.config
          grep -qx 'CONFIG_BPF_SYSCALL=y' out/.config
          grep -qx 'CONFIG_BPF_JIT=y' out/.config
          grep -qx 'CONFIG_BPF_JIT_ALWAYS_ON=y' out/.config
          grep -Fqx 'CONFIG_LOCALVERSION="-FakeDreamer-flos-W-J3S5000-NM2.2-KSU-bpf"' out/.config
          grep -E '^(CONFIG_BOARD_ALIOTH=|CONFIG_NOMOUNT=|CONFIG_KSU=|CONFIG_BPF=|CONFIG_BPF_SYSCALL=|CONFIG_BPF_JIT=|CONFIG_BPF_JIT_ALWAYS_ON=|CONFIG_LOCALVERSION=)' out/.config | tee "$GITHUB_WORKSPACE/config-report.txt"

      - name: Build Image.gz, DTBs and DTBO
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER='Tinieblass'
          export KBUILD_BUILD_HOST='GitHub-Actions'
          make O=out CC=clang LLVM=1 LLVM_IAS=1 -j2 Image.gz dtbs dtbo.img

      - name: Collect build outputs
        run: |
          set -euo pipefail
          BOOT=kernel/out/arch/arm64/boot
          test -s "$BOOT/Image.gz"
          test -s "$BOOT/dtbo.img"
          mkdir -p fakedreamer-flos22-output
          cp "$BOOT/Image.gz" "$BOOT/dtbo.img" fakedreamer-flos22-output/
          cp config-report.txt source-version.txt nomount-version.txt fakedreamer-flos22-output/
          (cd fakedreamer-flos22-output && sha256sum * > SHA256SUMS.txt)
          {
            echo '# FakeDreamer FLOS 2.2-rc2 - alioth'
            echo
            echo '- Device: POCO F3 / alioth'
            echo '- Source: re-noroi/kernel_sm8250 @ 1088c7141c6039cc2238798fdc13e6f1d7c9411c (FakeDreamer v2.1 FLOS W variant)'
            echo '- NoMount: v2.2.0, built-in and enabled (protocol v22)'
            echo '- Root: KernelSU driver enabled (CONFIG_KSU=y)'
            echo '- ROM variant: W (Android 16+, with upstream W BPF backport)'
            echo '- BPF: enabled and verified (BPF, syscall, JIT, JIT_ALWAYS_ON)'
            echo '- Battery: J3S Sun 5000mAh profile'
            echo '- Outputs: Image.gz and dtbo.img'
            echo '- VoWiFi: Raikiri-specific patch not yet included; no matching patch was present in the Raikiri build workflow/config inspected.'
            echo '- Raw build artifacts only; no device is flashed by CI.'
          } > fakedreamer-flos22-output/BUILD-REPORT.md

      - name: Upload FakeDreamer FLOS 2.2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fakedreamer-flos22-alioth-W-j3s5000-ksu-nomount22-bpf-raw
          path: fakedreamer-flos22-output/
          if-no-files-found: error
          compression-level: 0
