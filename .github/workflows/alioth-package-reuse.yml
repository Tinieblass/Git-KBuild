name: Repackage existing alioth kernel artifacts

on:
  push:
    branches:
      - Tiw-MidoriSU-alioth-test
    paths:
      - .github/package-only-trigger

permissions:
  actions: read
  contents: read

jobs:
  package_anykernel:
    runs-on: ubuntu-latest
    steps:
      - name: Read source build run ID
        id: source
        run: |
          set -euo pipefail
          RUN_ID="$(tr -d '[:space:]' < .github/package-only-trigger)"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid source run ID: $RUN_ID"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Reusing successful kernel artifacts from run $RUN_ID; no compiler download or kernel build."

      - name: Download original kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-1-1
          path: kernel-1-1
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download modified kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-1-2
          path: kernel-1-2
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download stock GPU kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-1-3
          path: kernel-1-3
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download effcpu stock GPU kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-1-4
          path: kernel-1-4
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all four existing build artifacts
        run: |
          set -euo pipefail
          find kernel-1-1 kernel-1-2 kernel-1-3 kernel-1-4 -maxdepth 1 -type f -printf '%p %s bytes\\n'
          test -s kernel-1-1/Image.gz
          test -s kernel-1-1/alioth-j3s-dtbo-aosp.img
          test -s kernel-1-1/alioth-normal-dtb
          test -s kernel-1-2/alioth-j3s-dtbo-miui.img
          test -s kernel-1-2/alioth-effcpu-dtb
          test -s kernel-1-3/alioth-stock-dtbo-aosp.img
          test -s kernel-1-3/alioth-normal-gpustk-dtb
          test -s kernel-1-4/alioth-stock-dtbo-miui.img
          test -s kernel-1-4/alioth-effcpu-gpustk-dtb

      - name: Clone AnyKernel3
        run: git clone --recursive --depth=1 --branch main https://github.com/re-noroi/anykernel3-test AnyKernel3-1

      - name: Assemble the existing kernel outputs
        run: |
          set -euo pipefail
          cp -a kernel-1-1/. AnyKernel3-1/
          cp -a kernel-1-2/. AnyKernel3-1/
          cp -a kernel-1-3/. AnyKernel3-1/
          cp -a kernel-1-4/. AnyKernel3-1/
          test -s AnyKernel3-1/Image.gz
          test -s AnyKernel3-1/alioth-j3s-dtbo-miui.img
          test -s AnyKernel3-1/alioth-effcpu-gpustk-dtb

      - name: Create requested W-variant ZIP
        id: zip
        run: |
          set -euo pipefail
          ZIP_NAME="FD-TEST-alioth-$(date -u +%Y%m%d)-W-j3s-miui-eff-uv.zip"
          (cd AnyKernel3-1 && zip -qr "../$ZIP_NAME" . -x '.git/*' '.github/*')
          test -s "$ZIP_NAME"
          echo "name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$ZIP_NAME"

      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FD-TEST-alioth-W-j3s-miui-eff-uv
          path: ${{ steps.zip.outputs.name }}
          if-no-files-found: error
