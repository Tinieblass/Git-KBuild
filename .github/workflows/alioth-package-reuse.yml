name: Repackage existing alioth kernel artifacts

on:
  # Manual dispatch lets the owner repackage the existing successful build without recompiling.
  workflow_dispatch:
  push:
    branches:
      - Tiw-MidoriSU-alioth-test
    paths:
      - .github/package-only-trigger

permissions:
  actions: read
  contents: read

jobs:
  package_anykernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository trigger file
        uses: actions/checkout@v4

      - name: Read source build run ID
        id: source
        run: |
          set -euo pipefail
          RUN_ID="$(head -n1 .github/package-only-trigger | tr -d '[:space:]')"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid source run ID: $RUN_ID"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Reusing successful kernel artifacts from run $RUN_ID; no compiler download or kernel build."

      - name: Download original kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-1-1
          path: kernel-1-1
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download modified kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-1-2
          path: kernel-1-2
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download stock GPU kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-1-3
          path: kernel-1-3
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download effcpu stock GPU kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-1-4
          path: kernel-1-4
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all four existing build artifacts
        run: |
          set -euo pipefail
          find kernel-1-1 kernel-1-2 kernel-1-3 kernel-1-4 -maxdepth 1 -type f -printf '%p %s bytes\\n'
          test -s kernel-1-1/Image.gz
          test -s kernel-1-1/alioth-j3s-dtbo-aosp.img
          test -s kernel-1-1/alioth-normal-dtb
          test -s kernel-1-2/alioth-j3s-dtbo-miui.img
          test -s kernel-1-2/alioth-effcpu-dtb
          test -s kernel-1-3/alioth-stock-dtbo-aosp.img
          test -s kernel-1-3/alioth-normal-gpustk-dtb
          test -s kernel-1-4/alioth-stock-dtbo-miui.img
          test -s kernel-1-4/alioth-effcpu-gpustk-dtb

      - name: Clone AnyKernel3
        run: git clone --recursive --depth=1 --branch main https://github.com/re-noroi/anykernel3-test AnyKernel3-1

      - name: Assemble the existing kernel outputs
        run: |
          set -euo pipefail
          cp -a kernel-1-1/. AnyKernel3-1/
          cp -a kernel-1-2/. AnyKernel3-1/
          cp -a kernel-1-3/. AnyKernel3-1/
          cp -a kernel-1-4/. AnyKernel3-1/
          test -s AnyKernel3-1/Image.gz
          test -s AnyKernel3-1/alioth-j3s-dtbo-miui.img
          test -s AnyKernel3-1/alioth-effcpu-gpustk-dtb

      # Alioth / HyperOS safety fix:
      # The upstream AnyKernel3 template's write_boot() also writes vendor_boot,
      # vendor_kernel_boot and vendor_dlkm. For this 4.19 alioth package we only
      # replace boot (kernel + selected DTB) and the active-slot DTBO. Do not
      # repack or flash vendor_boot from this package.
      - name: Restrict AnyKernel installer to boot and active-slot DTBO
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("AnyKernel3-1/anykernel.sh")
          text = path.read_text()
          marker = "## AnyKernel install"
          if text.count(marker) != 1:
              raise SystemExit("Expected exactly one AnyKernel install section; refusing unsafe rewrite.")
          prefix = text.split(marker, 1)[0]
          install = """## AnyKernel install - alioth safe path (boot + active-slot DTBO only)
          dump_boot;
          # Repack the existing boot ramdisk with the selected kernel and DTB.
          repack_ramdisk;
          flash_boot;
          # Flash only the DTBO matching the currently active A/B slot.
          test -s dtbo.img || abort "Selected DTBO image is missing. Aborting...";
          cp -f dtbo.img "dtbo$slot.img";
          flash_generic "dtbo$slot";
          ## end install
          """
          path.write_text(prefix + install)
          PY
          sh -n AnyKernel3-1/anykernel.sh
          grep -q 'dump_boot;' AnyKernel3-1/anykernel.sh
          grep -q 'repack_ramdisk;' AnyKernel3-1/anykernel.sh
          grep -q 'flash_boot;' AnyKernel3-1/anykernel.sh
          grep -q 'flash_generic "dtbo\$slot"' AnyKernel3-1/anykernel.sh
          ! grep -Eq 'block=.*/vendor_boot|flash_generic vendor_boot|flash_generic vendor_kernel_boot|flash_generic vendor_dlkm' AnyKernel3-1/anykernel.sh
          test "$(grep -c 'dump_boot;' AnyKernel3-1/anykernel.sh)" -eq 1
          test "$(grep -c 'flash_boot;' AnyKernel3-1/anykernel.sh)" -eq 1

      - name: Create requested W-variant ZIP
        id: zip
        run: |
          set -euo pipefail
          ZIP_NAME="FD-TEST-alioth-$(date -u +%Y%m%d)-W-j3s-miui-eff-uv.zip"
          (cd AnyKernel3-1 && zip -qr "../$ZIP_NAME" . -x '.git/*' '.github/*')
          test -s "$ZIP_NAME"
          echo "name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$ZIP_NAME"

      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FD-TEST-alioth-W-j3s-miui-eff-uv
          path: ${{ steps.zip.outputs.name }}
          if-no-files-found: error
