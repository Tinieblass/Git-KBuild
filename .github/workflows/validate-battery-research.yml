name: Validate battery profile research

on:
  push:
    branches:
      - Flash-Kernel
    paths:
      - "research/battery/**"
      - "tools/extract_qg_battery_luts.py"
      - "tools/analyze_bn61_reference.py"
      - "tools/compare_m703_qg_profiles.py"
      - "tools/verify_pm855gui_gen4_export.py"
      - "tools/verify_pm855gui_gen4_pairs.py"
      - "tools/normalize_m703_qg_curves.py"
      - "tools/compare_alioth_gen4_profiles.py"
      - "tools/validate_battery_research.py"
      - ".github/workflows/validate-battery-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate archived QG and Gen4 reference data
        run: |
          set -euo pipefail
          python3 tools/validate_battery_research.py

      - name: Compare authentic alioth PM855GUI Gen4 profiles
        run: |
          set -euo pipefail
          python3 tools/compare_alioth_gen4_profiles.py
          test -s research/battery/Gen4-Comparison/register-byte-comparison.csv
          test -s research/battery/Gen4-Comparison/register-word-comparison.csv
          test -s research/battery/Gen4-Comparison/profile-metadata.csv
          grep -q "J3S provision cross-check: PASS" research/battery/Gen4-Comparison/README.md

      - name: Quantitatively audit M703 reference surfaces
        run: |
          set -euo pipefail
          python3 tools/analyze_bn61_reference.py
          test -s research/battery/BN61-Reference-Analysis.md
          grep -q "This is not a BN61 characterization" research/battery/BN61-Reference-Analysis.md
      - name: Extract all M703 QG LUTs and verify table count
        run: |
          set -euo pipefail
          OUT="research/battery/M703-QG-Comparison/LUTs"
          python3 tools/extract_qg_battery_luts.py research/battery/M703-ATL-6000mah.dtsi "$OUT"
          test "$(find "$OUT" -maxdepth 1 -name '*.csv' | wc -l)" -eq 16
          grep -q 'pc-temp-z6-lut' "$OUT/SUMMARY.txt"
          grep -q 'pc-temp-y6-lut' "$OUT/SUMMARY.txt"
          cat "$OUT/SUMMARY.txt"

      - name: Compare 6000 mAh and 5160 mAh M703 QG surfaces
        run: |
          set -euo pipefail
          python3 tools/compare_m703_qg_profiles.py
          test -s research/battery/M703-QG-Comparison/table-comparison.csv
          grep -q "does not map QG values to PM855B Gen4 bytes" research/battery/M703-QG-Comparison/README.md
      - name: Normalize M703 QG OCV and FCC curves
        run: |
          set -euo pipefail
          python3 tools/normalize_m703_qg_curves.py
          test -s research/battery/M703-QG-Comparison/normalized/pc-temp-v1-lut.csv
          test -s research/battery/M703-QG-Comparison/normalized/pc-temp-v2-lut.csv
          test -s research/battery/M703-QG-Comparison/normalized/fcc1-temp-lut.csv
          grep -q "source value / 10" research/battery/M703-QG-Comparison/normalized/README.md
      - name: Verify PM855GUI export against the J3S Gen4 payload
        run: |
          set -euo pipefail
          python3 tools/verify_pm855gui_gen4_export.py
          test -s research/battery/PM855GUI-Gen4-Map/register-map.csv
          grep -q "Result: PASS" research/battery/PM855GUI-Gen4-Map/README.md
      - name: Cross-check three PM855GUI Gen4 export pairs
        run: |
          set -euo pipefail
          python3 tools/verify_pm855gui_gen4_pairs.py
          test -s research/battery/PM855GUI-Gen4-Map/multi-profile-verification.csv
          test -s research/battery/PM855GUI-Gen4-Map/multi-profile-register-words.csv
          grep -q "PM855GUI 1.0.0.13 and 1.0.0.14" research/battery/PM855GUI-Gen4-Map/MULTI-PROFILE-VALIDATION.md
      - name: Upload reproducible BN61 research report
        uses: actions/upload-artifact@v4
        with:
          name: bn61-reference-analysis
          path: |
            research/battery/BN61-Reference-Analysis.md
            research/battery/Gen4-Comparison/**
            research/battery/M703-QG-Comparison/**
            research/battery/PM855GUI-Gen4-Map/**
            research/battery/QG-GEN4-SEMANTIC-BOUNDARIES.md
          if-no-files-found: error
