name: Flash Kernel - alioth

on:
  push:
    branches:
      - Flash-Kernel
    paths:
      - '.github/workflows/flash-kernel-package.yml'
  workflow_dispatch:
    inputs:
      RAW_RUN_ID:
        description: 'Run ID da compilación de Flash Kernel (obrigatorio)'
        required: true
        type: string
      J3S_RAW_RUN_ID:
        description: 'Run ID do artefacto histórico validado J3S Sun 5000mAh (obrigatorio)'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Download exact verified Flash Kernel raw build
        uses: actions/download-artifact@v4
        with:
          name: flash-kernel-alioth-raw
          path: raw
          run-id: ${{ github.event.inputs.RAW_RUN_ID || '41418178305' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download verified J3S Sun 5000mAh DTBO
        uses: actions/download-artifact@v4
        with:
          name: raikiri-v17-alioth-j3s-raw
          path: raw-5k
          run-id: ${{ github.event.inputs.J3S_RAW_RUN_ID || '41160583371' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify raw build manifest and configuration
        run: |
          set -euo pipefail
          cd raw
          sha256sum -c SHA256SUMS.txt
          test -s Image.gz
          test -s dtbo.img
          test -s alioth-sm8250-overlay.dtbo
          grep -qF 'Target: POCO F3 / alioth / HyperOS 3 / Android 16' BUILD-REPORT.md
          grep -qF 'Stock profile: FMT/GY 4520mAh, original DTBO retained' BUILD-REPORT.md
          grep -qF 'VoWiFi/IMS: upstream code retained; no IMS source files changed by this workflow' BUILD-REPORT.md
          grep -qx 'CONFIG_KSU=y' <(grep '^CONFIG_KSU=' config-report.txt)
          grep -qx 'CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y' <(grep '^CONFIG_KSU_HACK_ARM64_BRANCH_LINK=' config-report.txt)
          grep -qx 'CONFIG_KSU_LSM_SECURITY_HOOKS=y' <(grep '^CONFIG_KSU_LSM_SECURITY_HOOKS=' config-report.txt)
          grep -qx 'CONFIG_NOMOUNT=y' <(grep '^CONFIG_NOMOUNT=' config-report.txt)
          grep -qx '# CONFIG_KPROBES is not set' <(grep '^# CONFIG_KPROBES is not set$' config-report.txt)
          echo 'PASS: Flash Kernel raw build, backslashxx driver, NoMount integration and preserved IMS provenance.'
          cd ../raw-5k
          # actions/download-artifact verifies the complete pinned artifact digest.
          # The historical 5k artifact has a legacy checksum manifest layout; validate its payload and provenance below.
          test -s dtbo.img
          test -s alioth-sm8250-overlay.dtbo
          grep -qF 'Source commit: 4d8105023e3d1474323f4118abc3b4ce6485070d' BUILD-REPORT.md
          grep -qF 'Battery profile selected in alioth overlay: J3S Sun 5000 mAh' BUILD-REPORT.md
          grep -qF 'Target: POCO F3 / alioth' BUILD-REPORT.md
          if cmp -s ../raw/dtbo.img dtbo.img; then echo 'ERROR: stock and 5K DTBO must be distinct' >&2; exit 1; fi
          cp dtbo.img ../raw/dtbo-5k.img
          echo 'PASS: distinct J3S Sun 5000mAh DTBO verified from the same pinned kernel source.'
          cd ../raw
          grep -qF 'BN61 profile: RESERVED (-6K); no DTBO generated pending validated Gen4 electrical characterization' BUILD-REPORT.md
          test -s BN61-STATUS.txt
          grep -qF 'RESERVED / NOT BUILT' BN61-STATUS.txt
          echo 'PASS: BN61 is deliberately excluded until a validated Gen4 profile exists.'

      - name: Fetch pinned AnyKernel3 template
        run: |
          set -euo pipefail
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          git -C anykernel checkout --detach 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
          test "$(git -C anykernel rev-parse HEAD)" = '41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1'
          test -f anykernel/LICENSE
          test -f anykernel/tools/ak3-core.sh
          test -f anykernel/META-INF/com/google/android/update-binary
          rm -rf anykernel/.git anykernel/.github anykernel/README.md

      - name: Assemble Flash Kernel alioth installer
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          cp raw/Image.gz anykernel/Image.gz
          cp raw/dtbo.img anykernel/dtbo.img
          cp raw/dtbo-5k.img anykernel/dtbo-5k.img
          BUILD_DATE="$(date -u +%Y%m%d)"
          STOCK_ZIP="FlashKernel${BUILD_DATE}.zip"
          FIVEK_ZIP="FlashKernel${BUILD_DATE}-5k.zip"
          printf '%s\n' "$BUILD_DATE" > build-date.txt
          cat > anykernel/anykernel.sh <<'AK3'
          ### Flash Kernel - POCO F3 / alioth
          ## Unofficial package by Tinieblass.

          properties() { '
          kernel.string=Flash Kernel by Tinieblass
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print 'Flash Kernel by Tinieblass';
          DEVICE=$(getprop ro.product.device);
          [ -n "$DEVICE" ] || DEVICE=$(getprop ro.build.product);
          [ -n "$DEVICE" ] || DEVICE=unknown;
          ui_print "Device: $DEVICE";
          HYPEROS_ID="$(getprop ro.build.version.incremental) $(getprop ro.miui.ui.version.name) $(getprop ro.mi.os.version.name)";
          if printf '%s' "$HYPEROS_ID" | grep -Eiq 'HyperOS|OS[0-9]+\\.[0-9]+'; then
            ui_print 'ROM: HyperOS';
          else
            ui_print 'ROM: other (no compatibility gate)';
          fi;
          ZIP_BASENAME="$(basename "$ZIPFILE" .zip)";
          case "$ZIP_BASENAME" in
            *-MIUI5K|*-miui5k)
              abort 'Suffix -MIUI5K is invalid; use -5K for the 5000mAh profile.';
              ;;
            *-6K|*-6k)
              abort 'BN61 5850mAh (-6K) is reserved and is not available in this build.';
              ;;
            *-5k|*-5K)
              DTBO_IMAGE=dtbo-5k.img;
              ui_print 'Bateria: J3S Sun 5000mAh';
              ;;
            *)
              DTBO_IMAGE=dtbo.img;
              ui_print 'Bateria: stock';
              ;;
          esac;

          # Preserve the installed boot ramdisk and replace only the kernel.
          dump_boot;
          # Flash the matching active-slot DTBO before touching boot.
          cp -f "$DTBO_IMAGE" dtbo$SLOT.img;
          flash_generic dtbo$SLOT;
          repack_ramdisk;
          flash_boot;
          AK3
          (cd anykernel && zip -qr9 "../$STOCK_ZIP" . -x '.git/*' '.github/*' 'README.md')
          cp "$STOCK_ZIP" "$FIVEK_ZIP"

      - name: Validate installer structure and embedded binaries
        run: |
          set -euo pipefail
          BUILD_DATE="$(cat build-date.txt)"
          ZIP="FlashKernel${BUILD_DATE}.zip"
          FIVEK_ZIP="FlashKernel${BUILD_DATE}-5k.zip"
          unzip -t "$ZIP"
          unzip -t "$FIVEK_ZIP"
          unzip -p "$ZIP" Image.gz | sha256sum | awk '{print $1}' > packaged-image.sha
          sha256sum raw/Image.gz | awk '{print $1}' > raw-image.sha
          diff -u raw-image.sha packaged-image.sha
          unzip -p "$ZIP" dtbo.img | sha256sum | awk '{print $1}' > packaged-dtbo.sha
          sha256sum raw/dtbo.img | awk '{print $1}' > raw-dtbo.sha
          diff -u raw-dtbo.sha packaged-dtbo.sha
          unzip -p "$ZIP" dtbo-5k.img | sha256sum | awk '{print $1}' > packaged-5k-dtbo.sha
          sha256sum raw/dtbo-5k.img | awk '{print $1}' > raw-5k-dtbo.sha
          diff -u raw-5k-dtbo.sha packaged-5k-dtbo.sha
          unzip -p "$ZIP" anykernel.sh | grep -q 'ui_print "Device:'
          unzip -p "$ZIP" anykernel.sh | grep -q 'ROM: other (no compatibility gate)'
          if unzip -p "$ZIP" anykernel.sh | grep -Eq 'abort.*(Dispositivo no compatible|ROM no compatible)'; then
            echo 'ERROR: device and ROM compatibility gates are forbidden' >&2
            exit 1
          fi
          unzip -p "$ZIP" anykernel.sh | grep -q 'kernel.string=Flash Kernel by Tinieblass'
          if unzip -p "$ZIP" anykernel.sh | grep -Eq 'device.name[0-9]+=|supported.versions='; then
            echo 'ERROR: installer contains a device/ROM/Android restriction or abort gate' >&2
            exit 1
          fi
          if unzip -p "$ZIP" anykernel.sh | LC_ALL=C grep -q '[^ -~]'; then
            echo 'ERROR: installer UI/script is not ASCII-only' >&2
            exit 1
          fi
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'flash_generic dtbo$SLOT'
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'ZIP_BASENAME'
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'dtbo-5k.img'
          unzip -p "$ZIP" anykernel.sh | grep -q 'Bateria: J3S Sun 5000mAh'
          unzip -p "$ZIP" anykernel.sh | grep -q 'BN61 5850mAh (-6K) is reserved'
          unzip -p "$ZIP" anykernel.sh | grep -q 'Suffix -MIUI5K is invalid'
          unzip -p "$ZIP" anykernel.sh | grep -q 'Bateria: stock'
          unzip -p "$ZIP" anykernel.sh | grep -q 'flash_boot'
          if unzip -p "$ZIP" anykernel.sh | grep -Eq 'write_boot|flash_generic (vendor_dlkm|system_dlkm)'; then
            echo 'ERROR: wrong battery branch or unrelated partition write detected' >&2
            exit 1
          fi
          unzip -l "$ZIP" | grep -E 'anykernel.sh|tools/ak3-core.sh|tools/magiskboot|Image.gz|dtbo.img|META-INF/com/google/android/update-binary|LICENSE'
          unzip -p "$FIVEK_ZIP" dtbo-5k.img | sha256sum | awk '{print $1}' > packaged-5k-named-dtbo.sha
          diff -u packaged-5k-dtbo.sha packaged-5k-named-dtbo.sha
          sha256sum "$ZIP" "$FIVEK_ZIP"


      - name: Upload dated kernel ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: FlashKernel${{ github.run_number }}-${{ github.run_attempt }}
          path: FlashKernel*.zip
          if-no-files-found: error
